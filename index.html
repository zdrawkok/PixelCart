    function PixelAvatar({ avatarId = 'knight', colorHex = '#2563eb', size = 36, className = '' }) {
      const avatarObj =
        PIXEL_AVATARS.find(
          (a) =>
            a.id === avatarId ||
            (avatarId === 'wizard' && a.id === 'mage') ||
            (avatarId === 'alchemist' && a.id === 'mage') ||
            (avatarId === 'robot' && a.id === 'robo')
        ) || PIXEL_AVATARS[0];

      const bg = colorHex || avatarObj.defaultColor;

      return (
        <div
          className={`inline-flex items-center justify-center border-2 border-[#1e1e24] shrink-0 select-none overflow-hidden relative shadow-[2px_2px_0px_0px_#1e1e24] ${className}`}
          style={{ width: size, height: size, backgroundColor: bg }}
          title={`${avatarObj.name} (${avatarObj.subtitle})`}
        >
          <div
            className="absolute inset-0 pointer-events-none opacity-25"
            style={{ background: 'radial-gradient(circle at 50% 25%, #ffffff 0%, transparent 70%)' }}
          />
          <svg
            viewBox="0 0 64 64"
            width={size}
            height={size}
            shapeRendering="geometricPrecision"
            className="block relative z-10"
          >
            {renderAvatarArtwork(avatarObj.id)}
          </svg>
        </div>
      );
    }

    const playPixelSound = (type, enabled = true) => {
      if (!enabled || typeof window === 'undefined') return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'check') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.06);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.start(now);
          osc.stop(now + 0.14);
        } else if (type === 'uncheck') {
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(349.23, now + 0.06);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'add') {
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.05);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'warning') {
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(196, now + 0.08);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch {}
    };

  created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);

-- 2. TABELA DOMOWNIKÓW (Maks. 5 awatarów na gospodarstwo)
CREATE TABLE IF NOT EXISTS public.household_members (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  household_id UUID NOT NULL REFERENCES public.households(id) ON DELETE CASCADE,
  display_name TEXT NOT NULL,
  avatar_id TEXT NOT NULL DEFAULT 'knight',
  color_hex TEXT NOT NULL DEFAULT '#3b82f6',
  created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE OR REPLACE FUNCTION public.enforce_max_household_members()
RETURNS TRIGGER AS $$
BEGIN
  IF (SELECT count(*) FROM public.household_members WHERE household_id = NEW.household_id) >= 5 THEN
    RAISE EXCEPTION 'Limit osiągnięty: Maksymalnie 5 domowników w jednym gospodarstwie.';
  END IF;
  RETURN NEW;
END;
$$ LANGUAGE plpgsql;

DROP TRIGGER IF EXISTS trg_max_members ON public.household_members;
CREATE TRIGGER trg_max_members
BEFORE INSERT ON public.household_members
FOR EACH ROW EXECUTE FUNCTION public.enforce_max_household_members();

-- 3. TABELA LIST ('shopping' | 'tasks')
CREATE TABLE IF NOT EXISTS public.lists (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  household_id UUID NOT NULL REFERENCES public.households(id) ON DELETE CASCADE,
  name TEXT NOT NULL,
  list_type TEXT NOT NULL DEFAULT 'shopping' CHECK (list_type IN ('shopping', 'tasks')),
  created_by UUID REFERENCES public.household_members(id) ON DELETE SET NULL,
  is_archived BOOLEAN NOT NULL DEFAULT false,
  created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);

-- 4. SŁOWNIK PRODUKTÓW GOSPODARSTWA (product_catalog)
CREATE TABLE IF NOT EXISTS public.product_catalog (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  household_id UUID NOT NULL REFERENCES public.households(id) ON DELETE CASCADE,
  name TEXT NOT NULL,
  default_unit TEXT NOT NULL DEFAULT 'szt.',
  category TEXT NOT NULL DEFAULT 'Inne',
  last_known_price NUMERIC(10,2),
  updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE UNIQUE INDEX IF NOT EXISTS idx_product_catalog_household_name
ON public.product_catalog (household_id, lower(name));

-- 5. POZYCJE LISTY (list_items)
CREATE TABLE IF NOT EXISTS public.list_items (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  list_id UUID NOT NULL REFERENCES public.lists(id) ON DELETE CASCADE,
  name TEXT NOT NULL,
  category TEXT NOT NULL DEFAULT 'Inne',
  quantity NUMERIC(10,3) NOT NULL DEFAULT 1,
  unit TEXT NOT NULL DEFAULT 'szt.',
  unit_price NUMERIC(10,2),
  is_checked BOOLEAN NOT NULL DEFAULT false,
  checked_at TIMESTAMPTZ,
  checked_by UUID REFERENCES public.household_members(id) ON DELETE SET NULL
);

CREATE UNIQUE INDEX IF NOT EXISTS idx_list_items_unique_name
ON public.list_items (list_id, lower(name));

-- 6. WŁĄCZENIE REALTIME DLA WSZYSTKICH TABEL
DO $$

DO $$

-- 7. POLITYKI DOSTĘPU DLA KLUCZA ANON (Dostęp przez Kod Domu w aplikacji)
ALTER TABLE public.households ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.household_members ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.lists ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.product_catalog ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.list_items ENABLE ROW LEVEL SECURITY;

DROP POLICY IF EXISTS "Public anon access households" ON public.households;
CREATE POLICY "Public anon access households" ON public.households FOR ALL USING (true) WITH CHECK (true);

DROP POLICY IF EXISTS "Public anon access members" ON public.household_members;
CREATE POLICY "Public anon access members" ON public.household_members FOR ALL USING (true) WITH CHECK (true);

DROP POLICY IF EXISTS "Public anon access lists" ON public.lists;
CREATE POLICY "Public anon access lists" ON public.lists FOR ALL USING (true) WITH CHECK (true);

DROP POLICY IF EXISTS "Public anon access catalog" ON public.product_catalog;
CREATE POLICY "Public anon access catalog" ON public.product_catalog FOR ALL USING (true) WITH CHECK (true);

DROP POLICY IF EXISTS "Public anon access items" ON public.list_items;
CREATE POLICY "Public anon access items" ON public.list_items FOR ALL USING (true) WITH CHECK (true);`;

    // ============================================================================
    // 6. MAIN APPLICATION COMPONENT (Dual Mode: LocalStorage + Live Supabase Cloud)
    // ============================================================================
    function App() {
      const STORAGE_KEY = 'pixelcart_db_v1';
      const SESSION_KEY = 'pixelcart_session_v1';
      const UNLOCKED_KEY = 'pixelcart_unlocked_v1';
      const THEME_KEY = 'pixelcart_theme_v1';
      const SUPA_CREDS_KEY = 'pixelcart_supabase_creds_v1';

      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem(THEME_KEY) || 'light'; } catch { return 'light'; }
      });

      useEffect(() => {
        try { localStorage.setItem(THEME_KEY, theme); } catch {}
      }, [theme]);

      const [soundEnabled, setSoundEnabled] = useState(true);

      // Supabase Credentials State (from window.PIXELCART_SUPABASE_CONFIG or localStorage)
      const [supaConfig, setSupaConfig] = useState(() => {
        const winCfg = window.PIXELCART_SUPABASE_CONFIG || {};
        if (winCfg.url && winCfg.anonKey) {
          return { url: winCfg.url.trim(), anonKey: winCfg.anonKey.trim() };
        }
        try {
          const saved = localStorage.getItem(SUPA_CREDS_KEY);
          if (saved) return JSON.parse(saved);
        } catch {}
        return { url: '', anonKey: '' };
      });

      const supabaseClient = useMemo(() => {
        if (supaConfig?.url && supaConfig?.anonKey) {
          try {
            return createClient(supaConfig.url, supaConfig.anonKey);
          } catch (e) {
            console.error('Invalid Supabase config:', e);
          }
        }
        return null;
      }, [supaConfig]);

      const [cloudConnected, setCloudConnected] = useState(false);

      // Local DB State
      const [db, setDb] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.households && parsed.lists) return parsed;
          }
        } catch {}
        return INITIAL_DB_STATE;
      });

      // Active Session
      const [session, setSession] = useState(() => {
        try {
          const saved = localStorage.getItem(SESSION_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && 'householdId' in parsed) return parsed;
          }
        } catch {}
        return {
          householdId: null,
          memberId: null,
          activeListId: null
        };
      });

      // Unlocked Households on this device (Only houses unlocked via Code + PIN are visible)
      const [unlockedIds, setUnlockedIds] = useState(() => {
        try {
          const saved = localStorage.getItem(UNLOCKED_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch {}
        return [];
      });

      useEffect(() => {
        try { localStorage.setItem(UNLOCKED_KEY, JSON.stringify(unlockedIds)); } catch {}
      }, [unlockedIds]);

      const unlockHouseholdOnDevice = useCallback((hId) => {
        setUnlockedIds((prev) => (prev.includes(hId) ? prev : [...prev, hId]));
      }, []);

      const handleLogoutHousehold = useCallback(() => {
        if (!session.householdId) return;
        const removedId = session.householdId;
        const remaining = unlockedIds.filter((id) => id !== removedId);
        setUnlockedIds(remaining);
        setSession({
          householdId: remaining[0] || null,
          memberId: null,
          activeListId: null
        });
      }, [session.householdId, unlockedIds]);

      const channelRef = useRef(null);
      const [syncPulse, setSyncPulse] = useState(false);
      const [lastSyncEvent, setLastSyncEvent] = useState('Tryb Lokalny (Gotowy na Supabase)');

      // Fetch full state from Supabase Cloud and seed if empty
      const fetchFromSupabase = useCallback(async () => {
        if (!supabaseClient) return;
        try {
          const [
            { data: households, error: e1 },
            { data: members, error: e2 },
            { data: lists, error: e3 },
            { data: catalog, error: e4 },
            { data: items, error: e5 }
          ] = await Promise.all([
            supabaseClient.from('households').select('*').order('created_at', { ascending: true }),
            supabaseClient.from('household_members').select('*').order('created_at', { ascending: true }),
            supabaseClient.from('lists').select('*').order('created_at', { ascending: true }),
            supabaseClient.from('product_catalog').select('*'),
            supabaseClient.from('list_items').select('*')
          ]);

          if (e1 || e2 || e3 || e4 || e5) {
            console.warn('Supabase fetch warning:', e1 || e2 || e3 || e4 || e5);
            setCloudConnected(false);
            return;
          }

          // If cloud DB is completely empty on first connect, seed initial demo households!
          if (!households || households.length === 0) {
            await supabaseClient.from('households').insert(INITIAL_DB_STATE.households);
            await supabaseClient.from('household_members').insert(INITIAL_DB_STATE.household_members);
            await supabaseClient.from('lists').insert(INITIAL_DB_STATE.lists);
            await supabaseClient.from('product_catalog').insert(INITIAL_DB_STATE.product_catalog);
            await supabaseClient.from('list_items').insert(INITIAL_DB_STATE.list_items);
            setDb(INITIAL_DB_STATE);
            setCloudConnected(true);
            setLastSyncEvent('☁️ Zainicjalizowano bazę Supabase!');
            return;
          }

          const nextState = {
            households: households || [],
            household_members: members || [],
            lists: lists || [],
            product_catalog: catalog || [],
            list_items: items || []
          };

          setDb(nextState);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
          setCloudConnected(true);
          setLastSyncEvent('☁️ Połączono z Supabase Realtime');
          setSyncPulse(true);
          setTimeout(() => setSyncPulse(false), 900);
        } catch (err) {
          console.error('Supabase connection error:', err);
          setCloudConnected(false);
        }
      }, [supabaseClient]);

      // Subscribe to Supabase Realtime + BroadcastChannel fallback
      useEffect(() => {
        if (supabaseClient) {
          fetchFromSupabase();
          const sub = supabaseClient
            .channel('pixelcart-cloud-changes')
            .on('postgres_changes', { event: '*', schema: 'public' }, () => {
              fetchFromSupabase();
            })
            .subscribe();

          return () => {
            supabaseClient.removeChannel(sub);
          };
        } else if (typeof window !== 'undefined' && 'BroadcastChannel' in window) {
          const bc = new BroadcastChannel('pixelcart_realtime_channel');
          bc.onmessage = (event) => {
            if (event.data && event.data.type === 'DB_UPDATE') {
              setDb(event.data.payload);
              setLastSyncEvent(event.data.description || 'Zsynchronizowano zmianę');
              setSyncPulse(true);
              setTimeout(() => setSyncPulse(false), 1200);
            }
          };
          channelRef.current = bc;
          return () => bc.close();
        }
      }, [supabaseClient, fetchFromSupabase]);

      const commitDb = useCallback((updater, description = 'Zaktualizowano listę') => {
        setDb((prev) => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
          } catch {}
          if (channelRef.current) {
            channelRef.current.postMessage({ type: 'DB_UPDATE', payload: next, description });
          }
          setLastSyncEvent(description);
          setSyncPulse(true);
          setTimeout(() => setSyncPulse(false), 900);
          return next;
        });
      }, []);
      // Derived Current Entities (Strictly isolated to unlocked household)
      const unlockedHouseholds = useMemo(
        () => db.households.filter((h) => unlockedIds.includes(h.id)),
        [db.households, unlockedIds]
      );

      const currentHousehold = useMemo(
        () => unlockedHouseholds.find((h) => h.id === session.householdId) || unlockedHouseholds[0] || null,
        [unlockedHouseholds, session.householdId]
      );

      const householdMembers = useMemo(
        () => currentHousehold ? db.household_members.filter((m) => m.household_id === currentHousehold.id) : [],
        [db.household_members, currentHousehold]
      );

      const currentMember = useMemo(
        () => householdMembers.find((m) => m.id === session.memberId) || householdMembers[0] || null,
        [householdMembers, session.memberId]
      );

      const householdLists = useMemo(
        () => currentHousehold ? db.lists.filter((l) => l.household_id === currentHousehold.id && !l.is_archived) : [],
        [db.lists, currentHousehold]
      );

      const activeList = useMemo(
        () => householdLists.find((l) => l.id === session.activeListId) || householdLists[0] || null,
        [householdLists, session.activeListId]
      );

      const householdCatalog = useMemo(
        () => currentHousehold ? db.product_catalog.filter((c) => c.household_id === currentHousehold.id) : [],
        [db.product_catalog, currentHousehold]
      );

      const activeListItems = useMemo(
        () => (activeList ? db.list_items.filter((i) => i.list_id === activeList.id) : []),
        [db.list_items, activeList]
      );

      useEffect(() => {
        if (currentHousehold) {
          const validMember = householdMembers.some((m) => m.id === session.memberId);
          const validList = householdLists.some((l) => l.id === session.activeListId);
          if (!validMember || !validList) {
            setSession((prev) => ({
              ...prev,
              householdId: currentHousehold.id,
              memberId: validMember ? prev.memberId : householdMembers[0]?.id || null,
              activeListId: validList ? prev.activeListId : householdLists[0]?.id || null
            }));
          }
        }
      }, [currentHousehold, householdMembers, householdLists, session.memberId, session.activeListId]);

      // UI States
      const [groupByCategory, setGroupByCategory] = useState(true);
      const [searchFilter, setSearchFilter] = useState('');
      const [itemName, setItemName] = useState('');
      const [itemQty, setItemQty] = useState('1');
      const [itemUnit, setItemUnit] = useState('szt.');
      const [itemPrice, setItemPrice] = useState('');
      const [itemCategory, setItemCategory] = useState('Inne');
      const [showAdderDetailsMobile, setShowAdderDetailsMobile] = useState(false);
      const [isInputFocused, setIsInputFocused] = useState(false);
      const [duplicateGuard, setDuplicateGuard] = useState(null);

      // Modals
      const [editingItem, setEditingItem] = useState(null);
      const [editingList, setEditingList] = useState(null);
      const [showHouseholdGateModal, setShowHouseholdGateModal] = useState(false);
      const [showAddMemberModal, setShowAddMemberModal] = useState(false);
      const [showNewListModal, setShowNewListModal] = useState(false);
      const [showDictionaryModal, setShowDictionaryModal] = useState(false);
      const [showExportModal, setShowExportModal] = useState(false);
      const [showSqlModal, setShowSqlModal] = useState(false);
      const [showMobileListsDrawer, setShowMobileListsDrawer] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const triggerToast = useCallback((msg) => {
        setToastMessage(msg);
        setTimeout(() => {
          setToastMessage((prev) => (prev === msg ? null : prev));
        }, 3200);
      }, []);

      // Smart Autocomplete
      const autocompleteSuggestions = useMemo(() => {
        const query = itemName.trim().toLowerCase();
        if (!query || query.length < 1 || activeList?.list_type !== 'shopping') return [];

        return householdCatalog
          .filter((catItem) => catItem.name.toLowerCase().includes(query))
          .sort((a, b) => {
            const aStarts = a.name.toLowerCase().startsWith(query);
            const bStarts = b.name.toLowerCase().startsWith(query);
            if (aStarts && !bStarts) return -1;
            if (!aStarts && bStarts) return 1;
            return a.name.localeCompare(b.name, 'pl');
          })
          .slice(0, 6);
      }, [itemName, householdCatalog, activeList?.list_type]);

      const handleSelectSuggestion = (suggestion) => {
        setItemName(suggestion.name);
        setItemUnit(suggestion.default_unit || 'szt.');
        setItemCategory(suggestion.category || 'Inne');
        setItemPrice(
          suggestion.last_known_price !== null && suggestion.last_known_price !== undefined
            ? String(suggestion.last_known_price)
            : ''
        );
        setDuplicateGuard(null);
      };

      const learnProductInDictionary = (draftDb, householdId, { name, unit, category, price }) => {
        const cleanName = name.trim();
        if (!cleanName) return draftDb.product_catalog;

        const existingIdx = draftDb.product_catalog.findIndex(
          (c) => c.household_id === householdId && c.name.toLowerCase() === cleanName.toLowerCase()
        );

        const parsedPrice =
          price !== '' && price !== null && price !== undefined && !isNaN(Number(price))
            ? Number(parseFloat(String(price).replace(',', '.')).toFixed(2))
            : null;

        if (existingIdx > -1) {
          const existing = draftDb.product_catalog[existingIdx];
          const updated = {
            ...existing,
            default_unit: unit || existing.default_unit,
            category: category && category !== 'Inne' ? category : existing.category,
            last_known_price: parsedPrice !== null ? parsedPrice : existing.last_known_price,
            updated_at: new Date().toISOString()
          };
          if (supabaseClient) {
            supabaseClient.from('product_catalog').update(updated).eq('id', existing.id).then();
          }
          const nextCatalog = [...draftDb.product_catalog];
          nextCatalog[existingIdx] = updated;
          return nextCatalog;
        } else {
          const newCatalogEntry = {
            id: generateId(),
            household_id: householdId,
            name: cleanName,
            default_unit: unit || 'szt.',
            category: category || 'Inne',
            last_known_price: parsedPrice,
            updated_at: new Date().toISOString()
          };
          if (supabaseClient) {
            supabaseClient.from('product_catalog').insert(newCatalogEntry).then();
          }
          return [...draftDb.product_catalog, newCatalogEntry];
        }
      };

      // Add Item + Variant B Duplicate Guard
      const handleAddItemSubmit = async (e) => {
        if (e) e.preventDefault();
        if (!activeList || !currentHousehold) return;

        const cleanName = itemName.trim();
        if (!cleanName) return;

        const parsedQty = Math.max(0.001, parseFloat(String(itemQty).replace(',', '.')) || 1);
        const parsedPrice =
          activeList.list_type === 'shopping' &&
          itemPrice !== '' &&
          !isNaN(parseFloat(String(itemPrice).replace(',', '.')))
            ? Number(parseFloat(String(itemPrice).replace(',', '.')).toFixed(2))
            : null;

        const dictMatch = householdCatalog.find(
          (c) => c.name.toLowerCase() === cleanName.toLowerCase()
        );

        const resolvedCategory =
          itemCategory !== 'Inne' ? itemCategory : dictMatch?.category || 'Inne';
        const resolvedUnit =
          activeList.list_type === 'shopping' ? itemUnit || dictMatch?.default_unit || 'szt.' : 'szt.';
        const resolvedPrice =
          activeList.list_type === 'shopping'
            ? parsedPrice !== null ? parsedPrice : dictMatch?.last_known_price ?? null
            : null;

        const existingOnList = activeListItems.find(
          (i) => i.name.toLowerCase() === cleanName.toLowerCase()
        );

        if (existingOnList) {
          playPixelSound('warning', soundEnabled);
          setDuplicateGuard({
            existingItem: existingOnList,
            attemptedQty: parsedQty,
            attemptedPrice: resolvedPrice,
            attemptedUnit: resolvedUnit,
            attemptedCategory: resolvedCategory
          });
          return;
        }

        const newItem = {
          id: generateId(),
          list_id: activeList.id,
          name: dictMatch ? dictMatch.name : cleanName,
          category: resolvedCategory,
          quantity: parsedQty,
          unit: resolvedUnit,
          unit_price: resolvedPrice,
          is_checked: false,
          checked_at: null,
          checked_by: null
        };

        commitDb((prev) => {
          const updatedCatalog =
            activeList.list_type === 'shopping'
              ? learnProductInDictionary(prev, currentHousehold.id, {
                  name: newItem.name,
                  unit: newItem.unit,
                  category: newItem.category,
                  price: newItem.unit_price
                })
              : prev.product_catalog;

          return {
            ...prev,
            list_items: [newItem, ...prev.list_items],
            product_catalog: updatedCatalog
          };
        }, `${currentMember?.display_name || 'Domownik'} dodał(a): ${newItem.name}`);

        if (supabaseClient) {
          await supabaseClient.from('list_items').insert(newItem);
        }

        playPixelSound('add', soundEnabled);
        setItemName('');
        setItemQty('1');
        setItemPrice('');
        setItemCategory('Inne');
        setDuplicateGuard(null);
      };

      const handleDuplicateIncreaseQuantity = async () => {
        if (!duplicateGuard || !duplicateGuard.existingItem) return;
        const { existingItem, attemptedQty, attemptedPrice } = duplicateGuard;
        const newQty = Number((Number(existingItem.quantity) + Number(attemptedQty)).toFixed(3));
        const nextPrice = attemptedPrice !== null ? attemptedPrice : existingItem.unit_price;

        commitDb((prev) => ({
          ...prev,
          list_items: prev.list_items.map((item) =>
            item.id === existingItem.id
              ? { ...item, quantity: newQty, unit_price: nextPrice }
              : item
          )
        }), `Zwiększono ilość: ${existingItem.name} (${newQty} ${existingItem.unit})`);

        if (supabaseClient) {
          await supabaseClient
            .from('list_items')
            .update({ quantity: newQty, unit_price: nextPrice })
            .eq('id', existingItem.id);
        }

        playPixelSound('add', soundEnabled);
        triggerToast(`Zwiększono ilość "${existingItem.name}" do ${newQty} ${existingItem.unit}`);
        setDuplicateGuard(null);
        setItemName('');
        setItemQty('1');
        setItemPrice('');
      };

      const handleDuplicateRestoreFromChecked = async () => {
        if (!duplicateGuard || !duplicateGuard.existingItem) return;
        const { existingItem, attemptedQty, attemptedPrice } = duplicateGuard;
        const nextQty = attemptedQty || existingItem.quantity;
        const nextPrice = attemptedPrice !== null ? attemptedPrice : existingItem.unit_price;

        commitDb((prev) => ({
          ...prev,
          list_items: prev.list_items.map((item) =>
            item.id === existingItem.id
              ? {
                  ...item,
                  is_checked: false,
                  checked_at: null,
                  checked_by: null,
                  quantity: nextQty,
                  unit_price: nextPrice
                }
              : item
          )
        }), `Przywrócono z kupionych: ${existingItem.name}`);

        if (supabaseClient) {
          await supabaseClient
            .from('list_items')
            .update({
              is_checked: false,
              checked_at: null,
              checked_by: null,
              quantity: nextQty,
              unit_price: nextPrice
            })
            .eq('id', existingItem.id);
        }

        playPixelSound('add', soundEnabled);
        triggerToast(`Przywrócono "${existingItem.name}" na główną listę!`);
        setDuplicateGuard(null);
        setItemName('');
        setItemQty('1');
        setItemPrice('');
      };

      // Checking, Editing & Deleting
      const handleToggleCheck = async (item) => {
        const nextChecked = !item.is_checked;
        const checkedAt = nextChecked ? new Date().toISOString() : null;
        const checkedBy = nextChecked ? currentMember?.id || null : null;

        playPixelSound(nextChecked ? 'check' : 'uncheck', soundEnabled);

        commitDb(
          (prev) => ({
            ...prev,
            list_items: prev.list_items.map((i) =>
              i.id === item.id
                ? { ...i, is_checked: nextChecked, checked_at: checkedAt, checked_by: checkedBy }
                : i
            )
          }),
          `${currentMember?.display_name || 'Domownik'} ${nextChecked ? 'odhaczył(a)' : 'przywrócił(a)'}: ${item.name}`
        );

        if (supabaseClient) {
          await supabaseClient
            .from('list_items')
            .update({ is_checked: nextChecked, checked_at: checkedAt, checked_by: checkedBy })
            .eq('id', item.id);
        }
      };

      const handleSaveEditedItem = async (updatedFields) => {
        if (!editingItem || !currentHousehold) return;
        const cleanName = updatedFields.name.trim() || editingItem.name;

        const duplicateOther = activeListItems.find(
          (i) => i.id !== editingItem.id && i.name.toLowerCase() === cleanName.toLowerCase()
        );
        if (duplicateOther) {
          playPixelSound('warning', soundEnabled);
          triggerToast(`Pozycja "${duplicateOther.name}" już istnieje na tej liście!`);
          return;
        }

        const parsedQty = Math.max(0.001, parseFloat(String(updatedFields.quantity).replace(',', '.')) || 1);
        const parsedPrice =
          updatedFields.unit_price !== '' &&
          updatedFields.unit_price !== null &&
          !isNaN(parseFloat(String(updatedFields.unit_price).replace(',', '.')))
            ? Number(parseFloat(String(updatedFields.unit_price).replace(',', '.')).toFixed(2))
            : null;

        const patch = {
          name: cleanName,
          quantity: parsedQty,
          unit: updatedFields.unit || editingItem.unit,
          unit_price: parsedPrice,
          category: updatedFields.category || editingItem.category
        };

        commitDb((prev) => {
          const nextItems = prev.list_items.map((i) => (i.id === editingItem.id ? { ...i, ...patch } : i));
          const nextCatalog =
            activeList?.list_type === 'shopping'
              ? learnProductInDictionary(prev, currentHousehold.id, {
                  name: cleanName,
                  unit: patch.unit,
                  category: patch.category,
                  price: parsedPrice
                })
              : prev.product_catalog;

          return { ...prev, list_items: nextItems, product_catalog: nextCatalog };
        }, `Zaktualizowano pozycję: ${cleanName}`);

        if (supabaseClient) {
          await supabaseClient.from('list_items').update(patch).eq('id', editingItem.id);
        }

        triggerToast(`Zapisano zmiany dla "${cleanName}"`);
        setEditingItem(null);
      };

      const handleUpdateList = async (listId, { name, listType }) => {
        const cleanName = name.trim();
        if (!cleanName) return;

        commitDb(
          (prev) => ({
            ...prev,
            lists: prev.lists.map((l) => (l.id === listId ? { ...l, name: cleanName, list_type: listType } : l))
          }),
          `Zmieniono listę: ${cleanName}`
        );

        if (supabaseClient) {
          await supabaseClient.from('lists').update({ name: cleanName, list_type: listType }).eq('id', listId);
        }

        setEditingList(null);
        triggerToast(`Zaktualizowano listę "${cleanName}"`);
      };

      const handleDeleteList = async (listId) => {
        const targetList = householdLists.find((l) => l.id === listId);
        const remainingLists = householdLists.filter((l) => l.id !== listId);

        commitDb(
          (prev) => ({
            ...prev,
            lists: prev.lists.filter((l) => l.id !== listId),
            list_items: prev.list_items.filter((i) => i.list_id !== listId)
          }),
          `Usunięto listę: ${targetList?.name || ''}`
        );

        if (supabaseClient) {
          await supabaseClient.from('lists').delete().eq('id', listId);
        }

        if (session.activeListId === listId) {
          setSession((prev) => ({ ...prev, activeListId: remainingLists[0]?.id || null }));
        }

        setEditingList(null);
        triggerToast(`Usunięto listę "${targetList?.name || ''}"`);
      };

      const handleDeleteItem = async (itemId) => {
        const target = activeListItems.find((i) => i.id === itemId);
        commitDb(
          (prev) => ({
            ...prev,
            list_items: prev.list_items.filter((i) => i.id !== itemId)
          }),
          `Usunięto pozycję: ${target?.name || ''}`
        );
        if (supabaseClient) {
          await supabaseClient.from('list_items').delete().eq('id', itemId);
        }
        if (editingItem?.id === itemId) setEditingItem(null);
      };

      const handleClearCheckedItems = async () => {
        if (!activeList) return;
        commitDb(
          (prev) => ({
            ...prev,
            list_items: prev.list_items.filter((i) => !(i.list_id === activeList.id && i.is_checked))
          }),
          `Wyczyszczono kupione pozycje z listy: ${activeList.name}`
        );
        if (supabaseClient) {
          await supabaseClient.from('list_items').delete().eq('list_id', activeList.id).eq('is_checked', true);
        }
        triggerToast('Usunięto wszystkie odhaczone pozycje.');
      };

      const handleSimulateFamilyMemberAction = async () => {
        if (!activeList || householdMembers.length === 0) return;
        const otherMembers = householdMembers.filter((m) => m.id !== currentMember?.id);
        const actor = otherMembers.length > 0 ? otherMembers[0] : currentMember;

        const unchecked = activeListItems.filter((i) => !i.is_checked);
        if (unchecked.length > 0) {
          const randomItem = unchecked[Math.floor(Math.random() * unchecked.length)];
          const nowIso = new Date().toISOString();
          playPixelSound('check', soundEnabled);
          commitDb(
            (prev) => ({
              ...prev,
              list_items: prev.list_items.map((i) =>
                i.id === randomItem.id
                  ? { ...i, is_checked: true, checked_at: nowIso, checked_by: actor.id }
                  : i
              )
            }),
            `⚡ LIVE: ${actor.display_name} włożył(a) do koszyka "${randomItem.name}"!`
          );
          if (supabaseClient) {
            await supabaseClient
              .from('list_items')
              .update({ is_checked: true, checked_at: nowIso, checked_by: actor.id })
              .eq('id', randomItem.id);
          }
          triggerToast(`⚡ ${actor.display_name} właśnie odhaczył(a): ${randomItem.name}`);
        } else {
          triggerToast('Wszystkie pozycje na tej liście są już odhaczone!');
        }
      };

      // Live Basket Totals & Item Grouping
      const { uncheckedItems, checkedItems, totals } = useMemo(() => {
        const query = searchFilter.trim().toLowerCase();
        const filtered = query
          ? activeListItems.filter(
              (i) =>
                i.name.toLowerCase().includes(query) ||
                (i.category && i.category.toLowerCase().includes(query))
            )
          : activeListItems;

        const unchecked = filtered.filter((i) => !i.is_checked);
        const checked = filtered
          .filter((i) => i.is_checked)
          .sort((a, b) => new Date(b.checked_at || 0) - new Date(a.checked_at || 0));

        let inBasketPLN = 0;
        let toBuyPLN = 0;

        activeListItems.forEach((item) => {
          const lineTotal = (Number(item.quantity) || 1) * (Number(item.unit_price) || 0);
          if (item.is_checked) inBasketPLN += lineTotal;
          else toBuyPLN += lineTotal;
        });

        return {
          uncheckedItems: unchecked,
          checkedItems: checked,
          totals: {
            inBasket: inBasketPLN.toFixed(2),
            toBuy: toBuyPLN.toFixed(2),
            total: (inBasketPLN + toBuyPLN).toFixed(2)
          }
        };
      }, [activeListItems, searchFilter]);

      const groupedUncheckedItems = useMemo(() => {
        if (!groupByCategory) {
          return [{ category: 'Wszystkie pozycje', icon: '📋', items: uncheckedItems }];
        }
        const categoryMeta = activeList?.list_type === 'shopping' ? SHOPPING_CATEGORIES : TASK_CATEGORIES;
        const map = new Map();
        uncheckedItems.forEach((item) => {
          const cat = item.category || 'Inne';
          if (!map.has(cat)) map.set(cat, []);
          map.get(cat).push(item);
        });

        const result = [];
        categoryMeta.forEach((meta) => {
          if (map.has(meta.id)) {
            result.push({ category: meta.label, icon: meta.icon, color: meta.color, items: map.get(meta.id) });
            map.delete(meta.id);
          }
        });

        map.forEach((items, cat) => {
          result.push({ category: cat, icon: '📦', color: '#64748b', items });
        });

        return result;
      }, [uncheckedItems, groupByCategory, activeList?.list_type]);

      const isDark = theme === 'dark';
      const bgMain = isDark ? 'bg-[#181825] text-[#f8f8f2]' : 'bg-[#f4f1ea] text-[#1e1e24]';
      const bgCard = isDark ? 'bg-[#242438] text-[#f8f8f2]' : 'bg-[#ffffff] text-[#1e1e24]';
      const bgSubtle = isDark ? 'bg-[#1e1e30] text-[#cbd5e1]' : 'bg-[#e8e3d5] text-[#1e1e24]';
      const borderPixel = 'border-2 border-[#1e1e24]';
      const shadowPixel = isDark ? 'shadow-[3px_3px_0px_0px_#0b0b12]' : 'shadow-[3px_3px_0px_0px_#1e1e24]';
      const btnTactile = `${borderPixel} ${shadowPixel} active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-transform`;

      const categoriesForCurrentList =
        activeList?.list_type === 'shopping' ? SHOPPING_CATEGORIES : TASK_CATEGORIES;

      // Full-screen PIN & Household Code Login Gate when no household is unlocked on this device
      if (!currentHousehold) {
        return (
          <div
            className={`min-h-screen flex flex-col items-center justify-center p-4 ${bgMain}`}
            style={{ fontFamily: "'JetBrains Mono', monospace" }}
          >
            <div className="mb-4 flex items-center gap-2">
              <button
                onClick={() => setShowSqlModal(true)}
                className={`px-3 py-1.5 text-xs font-bold ${borderPixel} ${
                  cloudConnected ? 'bg-[#10b981] text-[#1e1e24]' : 'bg-[#1e1e24] text-[#fde68a]'
                }`}
              >
                {cloudConnected ? '☁️ Supabase: POŁĄCZONO' : '⚙️ Konfiguracja SQL & Supabase'}
              </button>
              <button
                onClick={() => setTheme((prev) => (prev === 'light' ? 'dark' : 'light'))}
                className={`p-1.5 ${bgSubtle} ${borderPixel}`}
              >
                {isDark ? <Sun className="w-4 h-4 text-[#fde68a]" /> : <Moon className="w-4 h-4" />}
              </button>
            </div>

            <HouseholdGateModal
              isStandaloneGate={true}
              db={db}
              unlockedHouseholds={unlockedHouseholds}
              currentHousehold={null}
              onClose={() => {}}
              onSelectHousehold={(hId) => {
                unlockHouseholdOnDevice(hId);
                setSession((prev) => ({ ...prev, householdId: hId }));
              }}
              onUpdatePin={async () => {}}
              onLogoutHousehold={() => {}}
              onCreateHousehold={async ({ code, name, pin, memberName, avatarId, colorHex }) => {
                const newHouseholdId = generateId();
                const newMemberId = generateId();
                const newListId = generateId();

                const newHousehold = {
                  id: newHouseholdId,
                  code: code.toUpperCase(),
                  name,
                  pin_hash: pin || '',
                  created_at: new Date().toISOString()
                };
                const firstMember = {
                  id: newMemberId,
                  household_id: newHouseholdId,
                  display_name: memberName,
                  avatar_id: avatarId,
                  color_hex: colorHex,
                  created_at: new Date().toISOString()
                };
                const defaultShoppingList = {
                  id: newListId,
                  household_id: newHouseholdId,
                  name: 'Główna Lista Zakupowa',
                  list_type: 'shopping',
                  created_by: newMemberId,
                  is_archived: false,
                  created_at: new Date().toISOString()
                };
                const seededCatalog = createSeedCatalogForHousehold(newHouseholdId);

                commitDb(
                  (prev) => ({
                    ...prev,
                    households: [...prev.households, newHousehold],
                    household_members: [...prev.household_members, firstMember],
                    lists: [...prev.lists, defaultShoppingList],
                    product_catalog: [...prev.product_catalog, ...seededCatalog]
                  }),
                  `Utworzono nowe gospodarstwo: ${newHousehold.code}`
                );

                if (supabaseClient) {
                  await supabaseClient.from('households').insert(newHousehold);
                  await supabaseClient.from('household_members').insert(firstMember);
                  await supabaseClient.from('lists').insert(defaultShoppingList);
                  await supabaseClient.from('product_catalog').insert(seededCatalog);
                }

                unlockHouseholdOnDevice(newHouseholdId);
                setSession({
                  householdId: newHouseholdId,
                  memberId: newMemberId,
                  activeListId: newListId
                });
              }}
              bgCard={bgCard}
              bgSubtle={bgSubtle}
              btnTactile={btnTactile}
              borderPixel={borderPixel}
            />

            {showSqlModal && (
              <SqlSetupModal
                supaConfig={supaConfig}
                cloudConnected={cloudConnected}
                onSaveSupaConfig={(newCfg) => {
                  setSupaConfig(newCfg);
                  try { localStorage.setItem(SUPA_CREDS_KEY, JSON.stringify(newCfg)); } catch {}
                }}
                onClose={() => setShowSqlModal(false)}
                onCopied={() => {}}
                bgCard={bgCard}
                bgSubtle={bgSubtle}
                btnTactile={btnTactile}
                borderPixel={borderPixel}
              />
            )}
          </div>
        );
      }

      return (
        <div
          className={`min-h-screen flex flex-col ${bgMain} selection:bg-[#f59e0b] selection:text-[#1e1e24]`}
          style={{ fontFamily: "'JetBrains Mono', monospace" }}
        >
          {/* TOP HOUSEHOLD SECURITY & SUPABASE STATUS BAR (Only shows unlocked households) */}
          <div className="bg-[#1e1e24] text-[#f4f1ea] border-b-2 border-[#1e1e24] px-2.5 py-1.5 text-xs z-40">
            <div className="max-w-[1440px] mx-auto flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2 flex-wrap">
                <span
                  className="bg-[#10b981] text-[#1e1e24] px-1.5 py-0.5 font-bold uppercase tracking-wider text-[10px] flex items-center gap-1"
                  style={{ fontFamily: "'Silkscreen', cursive" }}
                >
                  <Shield className="w-3 h-3" /> TWÓJ DOM
                </span>
                {unlockedHouseholds.map((h) => {
                  const isSelected = h.id === currentHousehold?.id;
                  return (
                    <button
                      key={h.id}
                      onClick={() => {
                        setSession((prev) => ({ ...prev, householdId: h.id }));
                        setDuplicateGuard(null);
                        triggerToast(`Przełączono na: ${h.code} (${h.name})`);
                      }}
                      className={`px-2 py-0.5 border font-bold transition-colors ${
                        isSelected
                          ? 'bg-[#f59e0b] text-[#1e1e24] border-[#f59e0b]'
                          : 'bg-[#27272a] text-[#e4e4e7] border-[#52525b] hover:bg-[#3f3f46]'
                      }`}
                    >
                      🔒 {h.code}
                    </button>
                  );
                })}
                <button
                  onClick={() => setShowHouseholdGateModal(true)}
                  className="px-2 py-0.5 bg-[#3b82f6] text-white font-bold hover:bg-[#2563eb] flex items-center gap-1"
                  title="Zaloguj do innego domu kodem PIN lub zmień PIN"
                >
                  <KeyRound className="w-3 h-3" />
                  <span>Kod & PIN</span>
                </button>
                <button
                  onClick={() => {
                    handleLogoutHousehold();
                    triggerToast('Wylogowano z gospodarstwa na tym urządzeniu.');
                  }}
                  className="px-2 py-0.5 bg-[#ef4444] text-white font-bold hover:bg-[#dc2626] flex items-center gap-1"
                  title="Wyloguj z bieżącego domu na tym urządzeniu"
                >
                  <LogOut className="w-3 h-3" />
                  <span className="hidden sm:inline">Wyloguj</span>
                </button>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setShowSqlModal(true)}
                  className={`px-2 py-0.5 font-bold flex items-center gap-1 border ${
                    cloudConnected
                      ? 'bg-[#10b981] text-[#1e1e24] border-[#10b981]'
                      : 'bg-[#27272a] hover:bg-[#3f3f46] text-[#fde68a] border-[#52525b]'
                  }`}
                >
                  {cloudConnected ? <Cloud className="w-3 h-3" /> : <Database className="w-3 h-3" />}
                  <span>{cloudConnected ? 'Supabase: POŁĄCZONO' : 'SQL & Supabase'}</span>
                </button>
              </div>
            </div>
          </div>

          {/* COMPACT APP HEADER */}
          <header className={`sticky top-0 z-30 ${bgCard} border-b-2 border-[#1e1e24] px-3 py-2.5`}>
            <div className="max-w-[1440px] mx-auto flex items-center justify-between gap-2">
              <div className="flex items-center gap-2.5 min-w-0">
                <button
                  onClick={() => setShowMobileListsDrawer(true)}
                  className={`lg:hidden p-2 ${bgSubtle} ${btnTactile}`}
                  aria-label="Otwórz listy i domowników"
                >
                  <Layers className="w-5 h-5" />
                </button>

                <div className="flex items-center gap-2 min-w-0">
                  <div className="w-9 h-9 bg-[#f59e0b] border-2 border-[#1e1e24] shadow-[2px_2px_0px_0px_#1e1e24] flex items-center justify-center shrink-0">
                    <ShoppingBag className="w-5 h-5 text-[#1e1e24]" />
                  </div>
                  <div className="truncate">
                    <div className="flex items-center gap-2">
                      <h1
                        className="text-sm sm:text-base font-bold tracking-tight truncate"
                        style={{ fontFamily: "'Silkscreen', cursive" }}
                      >
                        PIXELCART
                      </h1>
                      <button
                        onClick={() => setShowHouseholdGateModal(true)}
                        className="px-1.5 py-0.5 text-[10px] font-bold bg-[#3b82f6] text-white border border-[#1e1e24] hover:opacity-90 truncate"
                        style={{ fontFamily: "'Silkscreen', cursive" }}
                      >
                        {currentHousehold?.code}
                      </button>
                    </div>
                    <div className="flex items-center gap-1.5 text-[11px] opacity-80 truncate">
                      <span
                        className={`w-2 h-2 inline-block border border-[#1e1e24] ${
                          syncPulse ? 'bg-[#f59e0b] scale-125' : 'bg-[#10b981]'
                        } transition-transform`}
                      />
                      <span className="truncate">{lastSyncEvent}</span>
                    </div>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <div className="flex items-center gap-1">
                  <div className="hidden sm:flex items-center gap-1 mr-1">
                    {householdMembers.map((member) => {
                      const isActive = member.id === currentMember?.id;
                      return (
                        <button
                          key={member.id}
                          onClick={() => {
                            setSession((prev) => ({ ...prev, memberId: member.id }));
                            triggerToast(`Aktywny profil: ${member.display_name}`);
                          }}
                          className={`relative p-0.5 transition-transform ${
                            isActive ? 'ring-2 ring-[#f59e0b] -translate-y-0.5' : 'opacity-65 hover:opacity-100'
                          }`}
                          title={`Przełącz na: ${member.display_name}`}
                        >
                          <PixelAvatar avatarId={member.avatar_id} colorHex={member.color_hex} size={30} />
                        </button>
                      );
                    })}
                    {householdMembers.length < 5 && (
                      <button
                        onClick={() => setShowAddMemberModal(true)}
                        className={`w-[30px] h-[30px] flex items-center justify-center ${bgSubtle} border-2 border-dashed border-[#1e1e24] hover:bg-[#f59e0b] hover:text-[#1e1e24] text-xs font-bold`}
                        title="Dodaj domownika (maks. 5)"
                      >
                        +
                      </button>
                    )}
                  </div>

                  <button
                    onClick={() => setShowAddMemberModal(true)}
                    className={`sm:hidden flex items-center gap-1.5 px-2 py-1 ${bgSubtle} ${btnTactile}`}
                  >
                    {currentMember && (
                      <PixelAvatar avatarId={currentMember.avatar_id} colorHex={currentMember.color_hex} size={24} />
                    )}
                    <span className="text-xs font-bold max-w-[70px] truncate">
                      {currentMember?.display_name}
                    </span>
                  </button>
                </div>

                <button
                  onClick={() => setShowDictionaryModal(true)}
                  className={`p-2 ${bgSubtle} ${btnTactile}`}
                  title={`Słownik produktów gospodarstwa (${householdCatalog.length})`}
                >
                  <BookOpen className="w-4 h-4" />
                </button>

                <button
                  onClick={() => setShowExportModal(true)}
                  className={`p-2 ${bgSubtle} ${btnTactile}`}
                  title="Eksportuj listę jako tekst"
                >
                  <FileText className="w-4 h-4" />
                </button>

                <button
                  onClick={() => setSoundEnabled((prev) => !prev)}
                  className={`hidden sm:inline-flex p-2 ${bgSubtle} ${btnTactile}`}
                >
                  {soundEnabled ? <Volume2 className="w-4 h-4" /> : <VolumeX className="w-4 h-4" />}
                </button>

                <button
                  onClick={() => setTheme((prev) => (prev === 'light' ? 'dark' : 'light'))}
                  className={`p-2 ${bgSubtle} ${btnTactile}`}
                >
                  {isDark ? <Sun className="w-4 h-4 text-[#fde68a]" /> : <Moon className="w-4 h-4" />}
                </button>
              </div>
            </div>
          </header>

          {/* MAIN WORKSPACE */}
          <div className="flex-1 max-w-[1440px] w-full mx-auto flex overflow-hidden">
            {/* LEFT SIDEBAR (Desktop) */}
            <aside className={`hidden lg:flex lg:w-[330px] shrink-0 flex-col border-r-2 border-[#1e1e24] ${bgCard} p-4 gap-5`}>
              <div className={`p-3 ${bgSubtle} ${borderPixel} ${shadowPixel}`}>
                <div className="flex items-center justify-between mb-2">
                  <span
                    className="text-xs font-bold uppercase tracking-wider text-[#f59e0b] bg-[#1e1e24] px-2 py-0.5"
                    style={{ fontFamily: "'Silkscreen', cursive" }}
                  >
                    {currentHousehold?.code}
                  </span>
                  <button
                    onClick={() => setShowHouseholdGateModal(true)}
                    className="text-xs font-bold underline hover:text-[#3b82f6] flex items-center gap-1"
                  >
                    <RefreshCw className="w-3 h-3" /> Zmień dom
                  </button>
                </div>
                <div className="font-bold text-base truncate">{currentHousehold?.name}</div>
                <div className="text-xs opacity-75 mt-0.5">
                  Izolowana baza list i słownik ({householdCatalog.length} prod.)
                </div>

                <div className="mt-3 pt-3 border-t-2 border-[#1e1e24]/20">
                  <div className="flex items-center justify-between text-xs font-bold mb-2">
                    <span>DOMOWNICY ({householdMembers.length}/5)</span>
                    <button
                      onClick={() => setShowAddMemberModal(true)}
                      className="text-[#3b82f6] hover:underline flex items-center gap-0.5"
                    >
                      <UserPlus className="w-3.5 h-3.5" />{' '}
                      {householdMembers.length < 5 ? '+ Dodaj / Edytuj' : 'Edytuj awatary'}
                    </button>
                  </div>
                  <div className="grid grid-cols-1 gap-1.5">
                    {householdMembers.map((m) => {
                      const isSelected = m.id === currentMember?.id;
                      return (
                        <div
                          key={m.id}
                          className={`flex items-center justify-between px-2 py-1.5 border-2 border-[#1e1e24] text-left transition-all ${
                            isSelected
                              ? 'bg-[#f59e0b] text-[#1e1e24] font-bold shadow-[2px_2px_0px_0px_#1e1e24]'
                              : `${bgCard} hover:opacity-90`
                          }`}
                        >
                          <button
                            type="button"
                            onClick={() => setSession((prev) => ({ ...prev, memberId: m.id }))}
                            className="flex items-center gap-2.5 min-w-0 flex-1 text-left"
                          >
                            <PixelAvatar avatarId={m.avatar_id} colorHex={m.color_hex} size={34} />
                            <span className="text-xs truncate">{m.display_name}</span>
                          </button>
                          <div className="flex items-center gap-1 shrink-0">
                            {isSelected && (
                              <span className="text-[10px] px-1.5 py-0.5 bg-[#1e1e24] text-white uppercase">
                                TY
                              </span>
                            )}
                            <button
                              type="button"
                              onClick={() => setShowAddMemberModal(true)}
                              className="p-1 hover:bg-black/10"
                            >
                              <Edit3 className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div className="flex-1 flex flex-col min-h-0">
                <div className="flex items-center justify-between mb-2">
                  <h2
                    className="text-xs font-bold uppercase tracking-wider"
                    style={{ fontFamily: "'Silkscreen', cursive" }}
                  >
                    TWOJE LISTY ({householdLists.length})
                  </h2>
                  <button
                    onClick={() => setShowNewListModal(true)}
                    className={`px-2.5 py-1 bg-[#10b981] text-[#1e1e24] text-xs font-bold ${btnTactile} flex items-center gap-1`}
                  >
                    <Plus className="w-3.5 h-3.5" /> Nowa lista
                  </button>
                </div>

                <div className="space-y-2 overflow-y-auto pr-1 flex-1">
                  {householdLists.map((list) => {
                    const isSelected = list.id === activeList?.id;
                    const listItems = db.list_items.filter((i) => i.list_id === list.id);
                    const uncheckedCount = listItems.filter((i) => !i.is_checked).length;

                    return (
                      <div
                        key={list.id}
                        onClick={() => {
                          setSession((prev) => ({ ...prev, activeListId: list.id }));
                          setDuplicateGuard(null);
                        }}
                        className={`group cursor-pointer p-3 ${borderPixel} transition-all flex items-center justify-between gap-2 ${
                          isSelected
                            ? 'bg-[#3b82f6] text-white shadow-[3px_3px_0px_0px_#1e1e24] translate-x-0.5'
                            : `${bgSubtle} hover:translate-x-0.5`
                        }`}
                      >
                        <div className="min-w-0 flex-1">
                          <div className="flex items-center gap-1.5">
                            {list.list_type === 'shopping' ? (
                              <ShoppingBag className="w-4 h-4 shrink-0" />
                            ) : (
                              <CheckSquare className="w-4 h-4 shrink-0" />
                            )}
                            <span className="font-bold text-sm truncate">{list.name}</span>
                          </div>
                          <div className={`text-[11px] mt-0.5 ${isSelected ? 'text-blue-100' : 'opacity-70'}`}>
                            {list.list_type === 'shopping'
                              ? '🛒 Lista Zakupowa (PLN + jedn.)'
                              : '☑️ Lista Zadań / Pakowanie'}
                          </div>
                        </div>

                        <div className="flex items-center gap-1 shrink-0">
                          <button
                            type="button"
                            onClick={(e) => {
                              e.stopPropagation();
                              setEditingList(list);
                            }}
                            className={`p-1.5 border border-[#1e1e24] ${
                              isSelected
                                ? 'bg-white/20 hover:bg-white/30 text-white'
                                : 'bg-black/5 hover:bg-[#f59e0b] hover:text-[#1e1e24]'
                            }`}
                          >
                            <Edit3 className="w-3.5 h-3.5" />
                          </button>
                          <span
                            className={`px-2 py-0.5 text-xs font-bold border-2 border-[#1e1e24] ${
                              uncheckedCount > 0 ? 'bg-[#f59e0b] text-[#1e1e24]' : 'bg-[#10b981] text-[#1e1e24]'
                            }`}
                            style={{ fontFamily: "'Silkscreen', cursive" }}
                          >
                            {uncheckedCount}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="pt-3 border-t-2 border-[#1e1e24] grid grid-cols-2 gap-2">
                <button
                  onClick={() => setShowDictionaryModal(true)}
                  className={`px-2.5 py-2 text-xs font-bold ${bgSubtle} ${btnTactile} flex items-center justify-center gap-1.5`}
                >
                  <BookOpen className="w-3.5 h-3.5" />
                  <span>Słownik ({householdCatalog.length})</span>
                </button>
                <button
                  onClick={() => setShowExportModal(true)}
                  className={`px-2.5 py-2 text-xs font-bold ${bgSubtle} ${btnTactile} flex items-center justify-center gap-1.5`}
                >
                  <Share2 className="w-3.5 h-3.5" />
                  <span>Udostępnij</span>
                </button>
              </div>
            </aside>

            {/* MAIN LIST WORKSPACE */}
            <main className="flex-1 flex flex-col min-w-0 pb-48 lg:pb-12 overflow-y-auto">
              <div className="px-3 sm:px-6 pt-3 pb-2">
                {/* Mobile Horizontal List Switcher Pills */}
                <div className="lg:hidden mb-2.5">
                  <div className="flex items-center justify-between text-[10px] font-bold uppercase opacity-75 mb-1 px-0.5">
                    <span>Twoje listy ({householdLists.length}) — przesuń palcem ↔</span>
                    <button
                      type="button"
                      onClick={() => setShowMobileListsDrawer(true)}
                      className="underline text-[#3b82f6]"
                    >
                      Wszystkie listy
                    </button>
                  </div>
                  <div
                    className="flex items-center gap-2 overflow-x-auto pb-1.5 pt-0.5 snap-x snap-mandatory scroll-smooth"
                    style={{ WebkitOverflowScrolling: 'touch' }}
                  >
                    {householdLists.map((list) => {
                      const isSelected = list.id === activeList?.id;
                      const uncheckedCount = db.list_items.filter(
                        (i) => i.list_id === list.id && !i.is_checked
                      ).length;
                      return (
                        <button
                          key={list.id}
                          onClick={() => {
                            setSession((prev) => ({ ...prev, activeListId: list.id }));
                            setDuplicateGuard(null);
                          }}
                          className={`snap-start px-2.5 py-1.5 text-xs font-bold shrink-0 flex items-center gap-1.5 ${borderPixel} ${
                            isSelected
                              ? 'bg-[#3b82f6] text-white shadow-[2px_2px_0px_0px_#1e1e24]'
                              : bgCard
                          }`}
                        >
                          <span>{list.list_type === 'shopping' ? '🛒' : '☑️'}</span>
                          <span className="whitespace-nowrap">{list.name}</span>
                          <span
                            className="px-1.5 py-0.5 bg-[#1e1e24] text-[#f59e0b] text-[10px] leading-none"
                            style={{ fontFamily: "'Silkscreen', cursive" }}
                          >
                            {uncheckedCount}
                          </span>
                        </button>
                      );
                    })}
                    <button
                      onClick={() => setShowNewListModal(true)}
                      className={`snap-start px-3 py-1.5 text-xs font-bold shrink-0 bg-[#10b981] text-[#1e1e24] ${borderPixel} shadow-[2px_2px_0px_0px_#1e1e24]`}
                    >
                      + Nowa lista
                    </button>
                  </div>
                </div>

                {activeList ? (
                  <div className={`p-3 sm:p-4 ${bgCard} ${borderPixel} ${shadowPixel} flex flex-col gap-2.5`}>
                    <div className="flex items-center justify-between gap-2 flex-wrap">
                      <span
                        className={`px-2 py-0.5 text-[10px] font-bold uppercase border border-[#1e1e24] ${
                          activeList.list_type === 'shopping'
                            ? 'bg-[#f59e0b] text-[#1e1e24]'
                            : 'bg-[#8b5cf6] text-white'
                        }`}
                        style={{ fontFamily: "'Silkscreen', cursive" }}
                      >
                        {activeList.list_type === 'shopping'
                          ? '🛒 LISTA ZAKUPOWA'
                          : '☑️ LISTA ZADAŃ / PAKOWANIE'}
                      </span>

                      <div className="flex items-center gap-1.5 ml-auto">
                        <button
                          type="button"
                          onClick={() => setEditingList(activeList)}
                          className={`px-2 py-1 text-[11px] font-bold ${bgSubtle} ${btnTactile} flex items-center gap-1`}
                        >
                          <Edit3 className="w-3.5 h-3.5 shrink-0" />
                          <span>Edytuj</span>
                        </button>

                        <button
                          type="button"
                          onClick={() => setGroupByCategory((prev) => !prev)}
                          className={`px-2 py-1 text-[11px] font-bold ${
                            groupByCategory ? 'bg-[#10b981] text-[#1e1e24]' : bgSubtle
                          } ${btnTactile} flex items-center gap-1`}
                        >
                          <Tag className="w-3.5 h-3.5 shrink-0" />
                          <span>{groupByCategory ? 'Alejki: WŁ' : 'Alejki: WYŁ'}</span>
                        </button>
                      </div>
                    </div>

                    <h2
                      className="text-sm sm:text-lg lg:text-xl font-bold leading-snug break-words"
                      style={{ fontFamily: "'Silkscreen', cursive" }}
                    >
                      {activeList.name}
                    </h2>

                    <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t-2 border-[#1e1e24]/15 text-xs">
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className={`px-2 py-0.5 text-[11px] font-bold ${bgSubtle} border border-[#1e1e24]`}>
                          Pozostało: <strong className="text-[#f59e0b]">{uncheckedItems.length}</strong>
                        </span>
                        <span className={`px-2 py-0.5 text-[11px] font-bold ${bgSubtle} border border-[#1e1e24]`}>
                          {activeList.list_type === 'shopping' ? 'Kupione:' : 'Załatwione:'}{' '}
                          <strong className="text-[#10b981]">{checkedItems.length}</strong>
                        </span>
                      </div>

                      {activeList.list_type === 'shopping' && (
                        <div
                          className={`w-full sm:w-auto grid grid-cols-3 sm:flex items-center gap-1 sm:gap-3 px-2.5 py-1.5 ${bgSubtle} border border-[#1e1e24] text-[11px] sm:text-xs text-center`}
                        >
                          <div>
                            <span className="opacity-75 block sm:inline sm:mr-1 text-[10px] sm:text-xs">W koszyku:</span>
                            <strong className="text-[#10b981]">{totals.inBasket} zł</strong>
                          </div>
                          <div className="border-x border-[#1e1e24]/20 sm:border-none px-1 sm:px-0">
                            <span className="opacity-75 block sm:inline sm:mr-1 text-[10px] sm:text-xs">Do kupienia:</span>
                            <strong className="text-[#f59e0b]">{totals.toBuy} zł</strong>
                          </div>
                          <div>
                            <span className="opacity-75 block sm:inline sm:mr-1 text-[10px] sm:text-xs">Suma:</span>
                            <strong>{totals.total} zł</strong>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className={`p-8 text-center ${bgCard} ${borderPixel} ${shadowPixel}`}>
                    <div className="text-2xl mb-2">🗂️</div>
                    <div className="text-sm font-bold uppercase mb-2" style={{ fontFamily: "'Silkscreen', cursive" }}>
                      Brak aktywnej listy w gospodarstwie {currentHousehold?.code}
                    </div>
                    <button
                      onClick={() => setShowNewListModal(true)}
                      className={`px-4 py-2 bg-[#10b981] text-[#1e1e24] text-xs font-bold ${btnTactile}`}
                    >
                      + Utwórz nową listę
                    </button>
                  </div>
                )}
              </div>

              {/* DESKTOP SMART ADDER */}
              {activeList && (
                <div className="hidden lg:block px-6 py-2">
                  <div className={`p-4 ${bgCard} ${borderPixel} ${shadowPixel} relative`}>
                    <form onSubmit={handleAddItemSubmit} className="flex items-end gap-2">
                      <div className="flex-1 relative">
                        <label className="block text-[11px] font-bold uppercase mb-1 opacity-75">
                          {activeList.list_type === 'shopping'
                            ? 'Dodaj produkt (Słownik uczy się nazw i cen)'
                            : 'Dodaj zadanie lub rzecz do spakowania'}
                        </label>
                        <input
                          type="text"
                          value={itemName}
                          onChange={(e) => {
                            setItemName(e.target.value);
                            if (duplicateGuard) setDuplicateGuard(null);
                          }}
                          onFocus={() => setIsInputFocused(true)}
                          onBlur={() => setTimeout(() => setIsInputFocused(false), 180)}
                          placeholder={
                            activeList.list_type === 'shopping'
                              ? 'np. Mleko 3.2%, Chleb żytni, Pomidory...'
                              : 'np. Spakować ładowarkę, Odebrać paczkę...'
                          }
                          className={`w-full px-3 py-2 text-sm font-bold ${bgSubtle} ${borderPixel} focus:outline-none focus:ring-2 focus:ring-[#f59e0b]`}
                        />

                        {isInputFocused && autocompleteSuggestions.length > 0 && !duplicateGuard && (
                          <div className={`absolute left-0 right-0 top-full mt-1 z-30 ${bgCard} ${borderPixel} ${shadowPixel} max-h-60 overflow-y-auto`}>
                            <div className="px-2.5 py-1 bg-[#1e1e24] text-[#f59e0b] text-[10px] font-bold uppercase flex justify-between">
                              <span>Podpowiedzi ze słownika ({currentHousehold?.code})</span>
                              <span>Kliknij, aby uzupełnić</span>
                            </div>
                            {autocompleteSuggestions.map((sug) => (
                              <button
                                type="button"
                                key={sug.id}
                                onMouseDown={() => handleSelectSuggestion(sug)}
                                className="w-full px-3 py-2 text-left text-xs border-b border-[#1e1e24]/20 hover:bg-[#f59e0b] hover:text-[#1e1e24] flex items-center justify-between transition-colors"
                              >
                                <div>
                                  <span className="font-bold">{sug.name}</span>
                                  <span className="ml-2 opacity-70 text-[11px]">({sug.category})</span>
                                </div>
                                <div className="font-bold">
                                  {sug.default_unit} •{' '}
                                  {sug.last_known_price ? `${Number(sug.last_known_price).toFixed(2)} zł` : 'brak ceny'}
                                </div>
                              </button>
                            ))}
                          </div>
                        )}
                      </div>

                      {activeList.list_type === 'shopping' && (
                        <>
                          <div className="w-24">
                            <label className="block text-[11px] font-bold uppercase mb-1 opacity-75">Ilość</label>
                            <input
                              type="number"
                              step="any"
                              min="0.01"
                              value={itemQty}
                              onChange={(e) => setItemQty(e.target.value)}
                              className={`w-full px-2.5 py-2 text-sm font-bold ${bgSubtle} ${borderPixel}`}
                            />
                          </div>

                          <div className="w-24">
                            <label className="block text-[11px] font-bold uppercase mb-1 opacity-75">Jedn.</label>
                            <select
                              value={itemUnit}
                              onChange={(e) => setItemUnit(e.target.value)}
                              className={`w-full px-2 py-2 text-sm font-bold ${bgSubtle} ${borderPixel}`}
                            >
                              {UNITS.map((u) => (
                                <option key={u} value={u}>{u}</option>
                              ))}
                            </select>
                          </div>

                          <div className="w-28">
                            <label className="block text-[11px] font-bold uppercase mb-1 opacity-75">Cena (PLN)</label>
                            <input
                              type="text"
                              inputMode="decimal"
                              placeholder="np. 4.50"
                              value={itemPrice}
                              onChange={(e) => setItemPrice(e.target.value)}
                              className={`w-full px-2.5 py-2 text-sm font-bold ${bgSubtle} ${borderPixel}`}
                            />
                          </div>
                        </>
                      )}

                      <div className="w-44">
                        <label className="block text-[11px] font-bold uppercase mb-1 opacity-75">Kategoria</label>
                        <select
                          value={itemCategory}
                          onChange={(e) => setItemCategory(e.target.value)}
                          className={`w-full px-2 py-2 text-sm font-bold ${bgSubtle} ${borderPixel}`}
                        >
                          {categoriesForCurrentList.map((c) => (
                            <option key={c.id} value={c.id}>{c.icon} {c.label}</option>
                          ))}
                        </select>
                      </div>

                      <button
                        type="submit"
                        className={`px-5 py-2 bg-[#10b981] text-[#1e1e24] font-bold text-sm ${btnTactile} flex items-center gap-1.5 shrink-0`}
                      >
                        <Plus className="w-4 h-4 stroke-[3]" />
                        <span>DODAJ</span>
                      </button>
                    </form>

                    {duplicateGuard && (
                      <div className="mt-3 p-3 bg-[#fef08a] text-[#1e1e24] border-2 border-[#1e1e24] shadow-[3px_3px_0px_0px_#1e1e24] flex flex-wrap items-center justify-between gap-3">
                        <div className="flex items-center gap-2.5">
                          <AlertTriangle className="w-5 h-5 text-[#dc2626] shrink-0" />
                          <div className="text-xs sm:text-sm font-bold">
                            {!duplicateGuard.existingItem.is_checked ? (
                              <span>
                                „{duplicateGuard.existingItem.name}” jest już na liście (
                                {duplicateGuard.existingItem.quantity} {duplicateGuard.existingItem.unit}). Co zrobić?
                              </span>
                            ) : (
                              <span>„{duplicateGuard.existingItem.name}” znajduje się już w Kupionych.</span>
                            )}
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          {!duplicateGuard.existingItem.is_checked ? (
                            <button
                              type="button"
                              onClick={handleDuplicateIncreaseQuantity}
                              className={`px-3 py-1.5 bg-[#10b981] text-[#1e1e24] text-xs font-bold ${btnTactile}`}
                            >
                              [+ Zwiększ ilość (+{duplicateGuard.attemptedQty} {duplicateGuard.existingItem.unit})]
                            </button>
                          ) : (
                            <button
                              type="button"
                              onClick={handleDuplicateRestoreFromChecked}
