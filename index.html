                              className={`px-3 py-1.5 bg-[#3b82f6] text-white text-xs font-bold ${btnTactile}`}
                            >
                              [Przywróć na listę (Odznacz)]
                            </button>
                          )}
                          <button
                            type="button"
                            onClick={() => setDuplicateGuard(null)}
                            className={`px-3 py-1.5 bg-white text-[#1e1e24] text-xs font-bold ${btnTactile}`}
                          >
                            [Anuluj]
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* ITEMS LIST */}
              <div className="px-3 sm:px-6 py-2 space-y-5">
                {uncheckedItems.length === 0 ? (
                  <div className={`p-8 text-center ${bgCard} ${borderPixel} ${shadowPixel} my-2`}>
                    <div className="text-3xl mb-2">✨</div>
                    <div className="text-sm font-bold uppercase" style={{ fontFamily: "'Silkscreen', cursive" }}>
                      Lista do zrobienia jest pusta!
                    </div>
                    <p className="text-xs opacity-75 mt-1">
                      Dodaj nowy produkt lub zadanie za pomocą paska wprowadzania.
                    </p>
                  </div>
                ) : (
                  groupedUncheckedItems.map((group) => (
                    <div key={group.category} className="space-y-1.5">
                      <div className="flex items-center justify-between px-1">
                        <div className="flex items-center gap-1.5">
                          <span>{group.icon}</span>
                          <span
                            className="text-xs font-bold uppercase tracking-wider"
                            style={{ fontFamily: "'Silkscreen', cursive" }}
                          >
                            {group.category}
                          </span>
                        </div>
                        <span className="text-[11px] font-bold opacity-65">{group.items.length} poz.</span>
                      </div>

                      <div className="space-y-2">
                        {group.items.map((item) => {
                          const lineCost =
                            item.unit_price !== null && item.unit_price !== undefined
                              ? (Number(item.quantity || 1) * Number(item.unit_price)).toFixed(2)
                              : null;

                          return (
                            <div
                              key={item.id}
                              className={`flex items-stretch ${bgCard} ${borderPixel} ${shadowPixel} hover:translate-x-[1px] transition-transform`}
                            >
                              <button
                                type="button"
                                onClick={() => handleToggleCheck(item)}
                                className="min-w-[50px] min-h-[50px] flex items-center justify-center border-r-2 border-[#1e1e24] hover:bg-[#10b981]/20 active:bg-[#10b981]/40 transition-colors shrink-0"
                              >
                                <div className="w-6 h-6 border-2 border-[#1e1e24] bg-white flex items-center justify-center shadow-[2px_2px_0px_0px_#1e1e24]" />
                              </button>

                              <div
                                onClick={() => setEditingItem(item)}
                                className="flex-1 px-3 py-2.5 flex items-center justify-between gap-2 cursor-pointer min-w-0"
                              >
                                <div className="min-w-0 flex-1">
                                  <div className="font-bold text-sm sm:text-base break-words leading-snug">
                                    {item.name}
                                  </div>
                                  {!groupByCategory && item.category && (
                                    <span className="text-[10px] opacity-65 uppercase">{item.category}</span>
                                  )}
                                </div>

                                <div className="flex items-center gap-2 shrink-0 text-right">
                                  {activeList?.list_type === 'shopping' ? (
                                    <>
                                      <span className={`px-2 py-0.5 text-xs font-bold ${bgSubtle} border border-[#1e1e24]`}>
                                        {Number(item.quantity)} {item.unit}
                                      </span>
                                      {item.unit_price !== null && item.unit_price !== undefined ? (
                                        <div className="text-xs">
                                          <div className="font-bold text-[#10b981]">{lineCost} zł</div>
                                          {Number(item.quantity) !== 1 && (
                                            <div className="text-[10px] opacity-65">
                                              ({Number(item.unit_price).toFixed(2)} zł/{item.unit})
                                            </div>
                                          )}
                                        </div>
                                      ) : (
                                        <span className="text-[11px] opacity-50 italic">+ cena</span>
                                      )}
                                    </>
                                  ) : (
                                    <span className="text-[11px] opacity-60 px-2 py-0.5 border border-current">
                                      {item.category || 'Zadanie'}
                                    </span>
                                  )}

                                  <button
                                    type="button"
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      setEditingItem(item);
                                    }}
                                    className={`p-1.5 ${bgSubtle} border border-[#1e1e24] hover:bg-[#f59e0b] hover:text-[#1e1e24]`}
                                  >
                                    <Edit3 className="w-3.5 h-3.5" />
                                  </button>
                                  <button
                                    type="button"
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      handleDeleteItem(item.id);
                                    }}
                                    className={`p-1.5 ${bgSubtle} border border-[#1e1e24] hover:bg-[#ef4444] hover:text-white`}
                                  >
                                    <Trash2 className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))
                )}

                {/* CHECKED ITEMS */}
                {checkedItems.length > 0 && (
                  <div className="pt-4 border-t-2 border-dashed border-[#1e1e24]/40">
                    <div className="flex items-center justify-between mb-2.5">
                      <span
                        className="text-xs font-bold uppercase tracking-wider opacity-80"
                        style={{ fontFamily: "'Silkscreen', cursive" }}
                      >
                        {activeList?.list_type === 'shopping'
                          ? `KUPIONE W KOSZYKU (${checkedItems.length})`
                          : `ZAŁATWIONE / SPAKOWANE (${checkedItems.length})`}
                      </span>
                      <button
                        onClick={handleClearCheckedItems}
                        className="text-xs font-bold text-[#ef4444] hover:underline flex items-center gap-1"
                      >
                        <Trash2 className="w-3.5 h-3.5" /> Wyczyść kupione
                      </button>
                    </div>

                    <div className="space-y-1.5 opacity-80">
                      {checkedItems.map((item) => {
                        const checker = db.household_members.find((m) => m.id === item.checked_by);
                        return (
                          <div key={item.id} className={`flex items-stretch ${bgSubtle} border-2 border-[#1e1e24]`}>
                            <button
                              type="button"
                              onClick={() => handleToggleCheck(item)}
                              className="min-w-[50px] min-h-[48px] flex items-center justify-center border-r-2 border-[#1e1e24] bg-[#10b981]/20 shrink-0"
                            >
                              <div className="w-6 h-6 border-2 border-[#1e1e24] bg-[#10b981] flex items-center justify-center">
                                <Check className="w-4 h-4 text-[#1e1e24] stroke-[3]" />
                              </div>
                            </button>

                            <div
                              onClick={() => setEditingItem(item)}
                              className="flex-1 px-3 py-2 flex items-center justify-between gap-2 cursor-pointer min-w-0"
                            >
                              <div className="min-w-0">
                                <span className="line-through font-bold text-sm opacity-75 break-words">
                                  {item.name}
                                </span>
                                {activeList?.list_type === 'shopping' && (
                                  <span className="ml-2 text-xs opacity-65">
                                    ({Number(item.quantity)} {item.unit}
                                    {item.unit_price
                                      ? ` • ${(Number(item.quantity) * Number(item.unit_price)).toFixed(2)} zł`
                                      : ''}
                                    )
                                  </span>
                                )}
                              </div>

                              <div className="flex items-center gap-1.5 shrink-0">
                                {checker && (
                                  <div
                                    className="flex items-center gap-1 px-1.5 py-0.5 bg-black/10 border border-[#1e1e24] text-[10px] font-bold"
                                    title={`Odhaczone przez: ${checker.display_name}`}
                                  >
                                    <PixelAvatar avatarId={checker.avatar_id} colorHex={checker.color_hex} size={20} />
                                    <span className="hidden sm:inline">{checker.display_name}</span>
                                  </div>
                                )}
                                <button
                                  type="button"
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    handleDeleteItem(item.id);
                                  }}
                                  className="p-1 border border-[#1e1e24] hover:bg-[#ef4444] hover:text-white"
                                >
                                  <Trash2 className="w-3.5 h-3.5" />
                                </button>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            </main>
          </div>

          {/* MOBILE FIXED BOTTOM BAR */}
          {activeList && (
            <div className="lg:hidden fixed bottom-0 left-0 right-0 z-30">
              {duplicateGuard && (
                <div className="mx-2 mb-1.5 p-3 bg-[#fef08a] text-[#1e1e24] border-2 border-[#1e1e24] shadow-[4px_4px_0px_0px_#1e1e24]">
                  <div className="flex items-start gap-2 mb-2">
                    <AlertTriangle className="w-5 h-5 text-[#dc2626] shrink-0 mt-0.5" />
                    <div className="text-xs font-bold leading-snug">
                      {!duplicateGuard.existingItem.is_checked ? (
                        <span>
                          „{duplicateGuard.existingItem.name}” jest już na liście (
                          {duplicateGuard.existingItem.quantity} {duplicateGuard.existingItem.unit}). Co zrobić?
                        </span>
                      ) : (
                        <span>„{duplicateGuard.existingItem.name}” znajduje się już w Kupionych.</span>
                      )}
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    {!duplicateGuard.existingItem.is_checked ? (
                      <button
                        type="button"
                        onClick={handleDuplicateIncreaseQuantity}
                        className={`flex-1 py-2 px-2 bg-[#10b981] text-[#1e1e24] text-xs font-bold ${btnTactile}`}
                      >
                        + Zwiększ ilość (+{duplicateGuard.attemptedQty})
                      </button>
                    ) : (
                      <button
                        type="button"
                        onClick={handleDuplicateRestoreFromChecked}
                        className={`flex-1 py-2 px-2 bg-[#3b82f6] text-white text-xs font-bold ${btnTactile}`}
                      >
                        Przywróć na listę (Odznacz)
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() => setDuplicateGuard(null)}
                      className={`py-2 px-3 bg-white text-[#1e1e24] text-xs font-bold ${btnTactile}`}
                    >
                      Anuluj
                    </button>
                  </div>
                </div>
              )}

              {autocompleteSuggestions.length > 0 && !duplicateGuard && (
                <div className={`mx-2 mb-1 ${bgCard} border-2 border-[#1e1e24] shadow-[4px_4px_0px_0px_#1e1e24] max-h-44 overflow-y-auto`}>
                  <div className="px-2.5 py-1 bg-[#1e1e24] text-[#f59e0b] text-[10px] font-bold uppercase flex justify-between">
                    <span>Słownik ({currentHousehold?.code})</span>
                    <span>Stuknij, aby wybrać</span>
                  </div>
                  {autocompleteSuggestions.map((sug) => (
                    <button
                      type="button"
                      key={sug.id}
                      onClick={() => handleSelectSuggestion(sug)}
                      className="w-full px-3 py-2 text-left text-xs border-b border-[#1e1e24]/20 active:bg-[#f59e0b] active:text-[#1e1e24] flex items-center justify-between"
                    >
                      <div className="truncate pr-2">
                        <span className="font-bold">{sug.name}</span>
                        <span className="ml-1.5 opacity-65 text-[10px]">({sug.category})</span>
                      </div>
                      <span className="font-bold shrink-0 text-[#10b981]">
                        {sug.default_unit} •{' '}
                        {sug.last_known_price ? `${Number(sug.last_known_price).toFixed(2)} zł` : ''}
                      </span>
                    </button>
                  ))}
                </div>
              )}

              {showAdderDetailsMobile && activeList.list_type === 'shopping' && (
                <div className={`mx-2 mb-1 p-2.5 ${bgCard} border-2 border-[#1e1e24] shadow-[3px_3px_0px_0px_#1e1e24] grid grid-cols-3 gap-2`}>
                  <div>
                    <label className="block text-[10px] font-bold uppercase opacity-75">Ilość</label>
                    <input
                      type="number"
                      step="any"
                      inputMode="decimal"
                      value={itemQty}
                      onChange={(e) => setItemQty(e.target.value)}
                      className={`w-full px-2 py-1 text-xs font-bold ${bgSubtle} border border-[#1e1e24]`}
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase opacity-75">Jedn.</label>
                    <select
                      value={itemUnit}
                      onChange={(e) => setItemUnit(e.target.value)}
                      className={`w-full px-1 py-1 text-xs font-bold ${bgSubtle} border border-[#1e1e24]`}
                    >
                      {UNITS.map((u) => (
                        <option key={u} value={u}>{u}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase opacity-75">Cena (PLN)</label>
                    <input
                      type="text"
                      inputMode="decimal"
                      placeholder="4.50"
                      value={itemPrice}
                      onChange={(e) => setItemPrice(e.target.value)}
                      className={`w-full px-2 py-1 text-xs font-bold ${bgSubtle} border border-[#1e1e24]`}
                    />
                  </div>
                </div>
              )}

              {activeList.list_type === 'shopping' && (
                <div className="bg-[#1e1e24] text-[#f4f1ea] px-3 py-1 text-[11px] flex items-center justify-between border-t-2 border-[#1e1e24]">
                  <span>W koszyku: <strong className="text-[#10b981]">{totals.inBasket} zł</strong></span>
                  <span>|</span>
                  <span>Do kupienia: <strong className="text-[#f59e0b]">{totals.toBuy} zł</strong></span>
                  <span>|</span>
                  <span>Suma: <strong>{totals.total} zł</strong></span>
                </div>
              )}

              <form
                onSubmit={handleAddItemSubmit}
                className={`${bgCard} border-t-2 border-[#1e1e24] p-2 flex items-center gap-1.5`}
              >
                {activeList.list_type === 'shopping' && (
                  <button
                    type="button"
                    onClick={() => setShowAdderDetailsMobile((prev) => !prev)}
                    className={`p-2.5 ${showAdderDetailsMobile ? 'bg-[#f59e0b] text-[#1e1e24]' : bgSubtle} ${borderPixel} shrink-0`}
                  >
                    <SlidersHorizontal className="w-4 h-4" />
                  </button>
                )}

                <input
                  type="text"
                  value={itemName}
                  onChange={(e) => {
                    setItemName(e.target.value);
                    if (duplicateGuard) setDuplicateGuard(null);
                  }}
                  placeholder={
                    activeList.list_type === 'shopping'
                      ? 'Dodaj produkt (np. Mleko)...'
                      : 'Dodaj zadanie do listy...'
                  }
                  className={`flex-1 px-3 py-2.5 text-sm font-bold ${bgSubtle} ${borderPixel} focus:outline-none`}
                />

                <button
                  type="submit"
                  className={`px-4 py-2.5 bg-[#10b981] text-[#1e1e24] font-bold text-sm ${btnTactile} shrink-0 flex items-center gap-1`}
                >
                  <Plus className="w-4 h-4 stroke-[3]" />
                  <span>DODAJ</span>
                </button>
              </form>
            </div>
          )}

          {/* MODALS & DRAWERS */}
          {editingItem && (
            <EditItemBottomSheet
              item={editingItem}
              listType={activeList?.list_type || 'shopping'}
              categories={categoriesForCurrentList}
              onClose={() => setEditingItem(null)}
              onSave={handleSaveEditedItem}
              onDelete={() => handleDeleteItem(editingItem.id)}
              bgCard={bgCard}
              bgSubtle={bgSubtle}
              btnTactile={btnTactile}
              borderPixel={borderPixel}
            />
          )}

          {showMobileListsDrawer && (
            <div className="fixed inset-0 z-50 bg-black/60 flex">
              <div className={`w-[85%] max-w-[340px] h-full ${bgCard} border-r-2 border-[#1e1e24] p-4 flex flex-col justify-between overflow-y-auto`}>
                <div className="space-y-4">
                  <div className="flex items-center justify-between border-b-2 border-[#1e1e24] pb-3">
                    <div>
                      <span className="text-xs px-1.5 py-0.5 bg-[#f59e0b] text-[#1e1e24] font-bold" style={{ fontFamily: "'Silkscreen', cursive" }}>
                        {currentHousehold?.code}
                      </span>
                      <h3 className="font-bold text-base mt-1">{currentHousehold?.name}</h3>
                    </div>
                    <button onClick={() => setShowMobileListsDrawer(false)} className={`p-1.5 ${bgSubtle} ${borderPixel}`}>
                      <X className="w-5 h-5" />
                    </button>
                  </div>

                  <button
                    onClick={() => {
                      setShowMobileListsDrawer(false);
                      setShowHouseholdGateModal(true);
                    }}
                    className={`w-full py-2 px-3 bg-[#3b82f6] text-white text-xs font-bold ${btnTactile} flex items-center justify-center gap-1.5`}
                  >
                    <KeyRound className="w-4 h-4" />
                    <span>Przełącz Kod Domu / Nowy Dom</span>
                  </button>

                  <div>
                    <div className="flex items-center justify-between text-xs font-bold mb-2">
                      <span>DOMOWNICY ({householdMembers.length}/5)</span>
                      <button
                        onClick={() => {
                          setShowMobileListsDrawer(false);
                          setShowAddMemberModal(true);
                        }}
                        className="text-[#3b82f6] underline"
                      >
                        + Dodaj / Edytuj
                      </button>
                    </div>
                    <div className="space-y-1.5">
                      {householdMembers.map((m) => (
                        <button
                          key={m.id}
                          onClick={() => {
                            setSession((prev) => ({ ...prev, memberId: m.id }));
                            setShowMobileListsDrawer(false);
                          }}
                          className={`w-full flex items-center justify-between p-2 border-2 border-[#1e1e24] ${
                            m.id === currentMember?.id ? 'bg-[#f59e0b] text-[#1e1e24] font-bold' : bgSubtle
                          }`}
                        >
                          <div className="flex items-center gap-2">
                            <PixelAvatar avatarId={m.avatar_id} colorHex={m.color_hex} size={26} />
                            <span className="text-xs">{m.display_name}</span>
                          </div>
                          {m.id === currentMember?.id && (
                            <span className="text-[10px] bg-[#1e1e24] text-white px-1.5 py-0.5">AKTYWNY</span>
                          )}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <div className="flex items-center justify-between text-xs font-bold mb-2">
                      <span>LISTY W TYM DOMU ({householdLists.length})</span>
                      <button
                        onClick={() => {
                          setShowMobileListsDrawer(false);
                          setShowNewListModal(true);
                        }}
                        className="text-[#10b981] font-bold underline"
                      >
                        + Nowa lista
                      </button>
                    </div>
                    <div className="space-y-2">
                      {householdLists.map((l) => {
                        const count = db.list_items.filter((i) => i.list_id === l.id && !i.is_checked).length;
                        return (
                          <div
                            key={l.id}
                            className={`w-full p-2 text-left border-2 border-[#1e1e24] flex items-center justify-between gap-1 ${
                              l.id === activeList?.id ? 'bg-[#3b82f6] text-white font-bold' : bgSubtle
                            }`}
                          >
                            <button
                              type="button"
                              onClick={() => {
                                setSession((prev) => ({ ...prev, activeListId: l.id }));
                                setShowMobileListsDrawer(false);
                              }}
                              className="text-xs truncate flex-1 text-left py-0.5"
                            >
                              {l.list_type === 'shopping' ? '🛒 ' : '☑️ '}
                              {l.name}
                            </button>
                            <div className="flex items-center gap-1 shrink-0">
                              <button
                                type="button"
                                onClick={() => {
                                  setShowMobileListsDrawer(false);
                                  setEditingList(l);
                                }}
                                className="p-1 border border-[#1e1e24] bg-black/10 hover:bg-[#f59e0b] hover:text-[#1e1e24]"
                              >
                                <Edit3 className="w-3.5 h-3.5" />
                              </button>
                              <span className="px-1.5 py-0.5 text-[10px] bg-[#1e1e24] text-[#f59e0b]">{count}</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                <div className="pt-4 border-t-2 border-[#1e1e24] flex gap-2">
                  <button
                    onClick={() => {
                      setShowMobileListsDrawer(false);
                      setShowSqlModal(true);
                    }}
                    className={`flex-1 py-2 text-xs font-bold ${bgSubtle} ${btnTactile}`}
                  >
                    SQL & Supabase
                  </button>
                </div>
              </div>
              <div className="flex-1" onClick={() => setShowMobileListsDrawer(false)} />
            </div>
          )}

          {showHouseholdGateModal && (
            <HouseholdGateModal
              isStandaloneGate={false}
              db={db}
              unlockedHouseholds={unlockedHouseholds}
              currentHousehold={currentHousehold}
              onClose={() => setShowHouseholdGateModal(false)}
              onSelectHousehold={(hId) => {
                unlockHouseholdOnDevice(hId);
                setSession((prev) => ({ ...prev, householdId: hId }));
                setShowHouseholdGateModal(false);
                const target = db.households.find((h) => h.id === hId);
                triggerToast(`Zalogowano do gospodarstwa: ${target?.code}`);
              }}
              onUpdatePin={async (hId, newPin) => {
                commitDb(
                  (prev) => ({
                    ...prev,
                    households: prev.households.map((h) =>
                      h.id === hId ? { ...h, pin_hash: newPin } : h
                    )
                  }),
                  `Zaktualizowano kod PIN domu`
                );
                if (supabaseClient) {
                  await supabaseClient.from('households').update({ pin_hash: newPin }).eq('id', hId);
                }
                triggerToast('Zapisano nowy kod PIN dla Twojego domu!');
              }}
              onLogoutHousehold={() => {
                handleLogoutHousehold();
                setShowHouseholdGateModal(false);
                triggerToast('Wylogowano z domu na tym urządzeniu.');
              }}
              onCreateHousehold={async ({ code, name, pin, memberName, avatarId, colorHex }) => {
                const newHouseholdId = generateId();
                const newMemberId = generateId();
                const newListId = generateId();

                const newHousehold = {
                  id: newHouseholdId,
                  code: code.toUpperCase(),
                  name,
                  pin_hash: pin || '',
                  created_at: new Date().toISOString()
                };
                const firstMember = {
                  id: newMemberId,
                  household_id: newHouseholdId,
                  display_name: memberName,
                  avatar_id: avatarId,
                  color_hex: colorHex,
                  created_at: new Date().toISOString()
                };
                const defaultShoppingList = {
                  id: newListId,
                  household_id: newHouseholdId,
                  name: 'Główna Lista Zakupowa',
                  list_type: 'shopping',
                  created_by: newMemberId,
                  is_archived: false,
                  created_at: new Date().toISOString()
                };
                const seededCatalog = createSeedCatalogForHousehold(newHouseholdId);

                commitDb(
                  (prev) => ({
                    ...prev,
                    households: [...prev.households, newHousehold],
                    household_members: [...prev.household_members, firstMember],
                    lists: [...prev.lists, defaultShoppingList],
                    product_catalog: [...prev.product_catalog, ...seededCatalog]
                  }),
                  `Utworzono nowe gospodarstwo: ${newHousehold.code}`
                );

                if (supabaseClient) {
                  await supabaseClient.from('households').insert(newHousehold);
                  await supabaseClient.from('household_members').insert(firstMember);
                  await supabaseClient.from('lists').insert(defaultShoppingList);
                  await supabaseClient.from('product_catalog').insert(seededCatalog);
                }

                unlockHouseholdOnDevice(newHouseholdId);
                setSession({
                  householdId: newHouseholdId,
                  memberId: newMemberId,
                  activeListId: newListId
                });
                setShowHouseholdGateModal(false);
                triggerToast(`Utworzono gospodarstwo ${newHousehold.code}!`);
              }}
              bgCard={bgCard}
              bgSubtle={bgSubtle}
              btnTactile={btnTactile}
              borderPixel={borderPixel}
            />
          )}

          {showAddMemberModal && currentHousehold && (
            <MemberAvatarModal
              household={currentHousehold}
              members={householdMembers}
              currentMember={currentMember}
              onClose={() => setShowAddMemberModal(false)}
              onSelectMember={(mId) => {
                setSession((prev) => ({ ...prev, memberId: mId }));
                setShowAddMemberModal(false);
              }}
              onAddMember={async ({ displayName, avatarId, colorHex }) => {
                if (householdMembers.length >= 5) return;
                const newMember = {
                  id: generateId(),
                  household_id: currentHousehold.id,
                  display_name: displayName,
                  avatar_id: avatarId,
                  color_hex: colorHex,
                  created_at: new Date().toISOString()
                };
                commitDb(
                  (prev) => ({ ...prev, household_members: [...prev.household_members, newMember] }),
                  `Nowy domownik w ${currentHousehold.code}: ${displayName}`
                );
                if (supabaseClient) {
                  await supabaseClient.from('household_members').insert(newMember);
                }
                setSession((prev) => ({ ...prev, memberId: newMember.id }));
                setShowAddMemberModal(false);
                triggerToast(`Dodano profil: ${displayName}`);
              }}
              onUpdateMember={async (memberId, { displayName, avatarId, colorHex }) => {
                commitDb(
                  (prev) => ({
                    ...prev,
                    household_members: prev.household_members.map((m) =>
                      m.id === memberId
                        ? { ...m, display_name: displayName, avatar_id: avatarId, color_hex: colorHex }
                        : m
                    )
                  }),
                  `Zaktualizowano profil: ${displayName}`
                );
                if (supabaseClient) {
                  await supabaseClient
                    .from('household_members')
                    .update({ display_name: displayName, avatar_id: avatarId, color_hex: colorHex })
                    .eq('id', memberId);
                }
                triggerToast(`Zaktualizowano postać: ${displayName}`);
              }}
              bgCard={bgCard}
              bgSubtle={bgSubtle}
              btnTactile={btnTactile}
              borderPixel={borderPixel}
            />
          )}

          {editingList && (
            <EditListModal
              list={editingList}
              onClose={() => setEditingList(null)}
              onSave={(fields) => handleUpdateList(editingList.id, fields)}
              onDelete={() => handleDeleteList(editingList.id)}
              bgCard={bgCard}
              bgSubtle={bgSubtle}
              btnTactile={btnTactile}
              borderPixel={borderPixel}
            />
          )}

          {showNewListModal && currentHousehold && (
            <CreateListModal
              onClose={() => setShowNewListModal(false)}
              onCreate={async ({ name, listType }) => {
                const newList = {
                  id: generateId(),
                  household_id: currentHousehold.id,
                  name,
                  list_type: listType,
                  created_by: currentMember?.id || null,
                  is_archived: false,
                  created_at: new Date().toISOString()
                };
                commitDb((prev) => ({ ...prev, lists: [...prev.lists, newList] }), `Utworzono nową listę: ${name}`);
                if (supabaseClient) {
                  await supabaseClient.from('lists').insert(newList);
                }
                setSession((prev) => ({ ...prev, activeListId: newList.id }));
                setShowNewListModal(false);
                triggerToast(`Utworzono listę "${name}"`);
              }}
              bgCard={bgCard}
              bgSubtle={bgSubtle}
              btnTactile={btnTactile}
              borderPixel={borderPixel}
            />
          )}

          {showDictionaryModal && currentHousehold && (
            <DictionaryModal
              household={currentHousehold}
              catalog={householdCatalog}
              onClose={() => setShowDictionaryModal(false)}
              onAddCatalogItem={({ name, unit, category, price }) => {
                const cleanName = name.trim();
                if (!cleanName) return;
                commitDb(
                  (prev) => ({
                    ...prev,
                    product_catalog: learnProductInDictionary(prev, currentHousehold.id, {
                      name: cleanName,
                      unit,
                      category,
                      price
                    })
                  }),
                  `Dodano do słownika: ${cleanName}`
                );
                triggerToast(`Dodano "${cleanName}" do słownika produktów!`);
              }}
              onUpdateCatalogItem={async (itemId, { name, price, unit, category }) => {
                const cleanName = name.trim();
                if (!cleanName) return;
                const duplicate = householdCatalog.find(
                  (c) => c.id !== itemId && c.name.toLowerCase() === cleanName.toLowerCase()
                );
                if (duplicate) {
                  triggerToast(`Produkt "${duplicate.name}" już istnieje w słowniku!`);
                  return;
                }
                const nowIso = new Date().toISOString();
                commitDb(
                  (prev) => ({
                    ...prev,
                    product_catalog: prev.product_catalog.map((c) =>
                      c.id === itemId
                        ? { ...c, name: cleanName, last_known_price: price, default_unit: unit, category, updated_at: nowIso }
                        : c
                    )
                  }),
                  `Zaktualizowano w słowniku: ${cleanName}`
                );
                if (supabaseClient) {
                  await supabaseClient
                    .from('product_catalog')
                    .update({ name: cleanName, last_known_price: price, default_unit: unit, category, updated_at: nowIso })
                    .eq('id', itemId);
                }
                triggerToast(`Zaktualizowano produkt "${cleanName}" w słowniku.`);
              }}
              onDeleteCatalogItem={async (itemId) => {
                const target = householdCatalog.find((c) => c.id === itemId);
                commitDb(
                  (prev) => ({ ...prev, product_catalog: prev.product_catalog.filter((c) => c.id !== itemId) }),
                  `Usunięto ze słownika: ${target?.name || ''}`
                );
                if (supabaseClient) {
                  await supabaseClient.from('product_catalog').delete().eq('id', itemId);
                }
                triggerToast(`Usunięto "${target?.name || 'produkt'}" ze słownika.`);
              }}
              bgCard={bgCard}
              bgSubtle={bgSubtle}
              btnTactile={btnTactile}
              borderPixel={borderPixel}
            />
          )}

          {showExportModal && activeList && currentHousehold && (
            <ExportShareModal
              household={currentHousehold}
              list={activeList}
              uncheckedItems={uncheckedItems}
              checkedItems={checkedItems}
              totals={totals}
              onClose={() => setShowExportModal(false)}
              onCopied={() => triggerToast('Skopiowano do schowka!')}
              bgCard={bgCard}
              bgSubtle={bgSubtle}
              btnTactile={btnTactile}
              borderPixel={borderPixel}
            />
          )}

          {showSqlModal && (
            <SqlSetupModal
              supaConfig={supaConfig}
              cloudConnected={cloudConnected}
              onSaveSupaConfig={(newCfg) => {
                setSupaConfig(newCfg);
                try { localStorage.setItem(SUPA_CREDS_KEY, JSON.stringify(newCfg)); } catch {}
                triggerToast(newCfg.url ? 'Zapisano klucze Supabase! Łączenie z chmurą...' : 'Rozłączono Supabase (Tryb Lokalny)');
              }}
              onClose={() => setShowSqlModal(false)}
              onCopied={() => triggerToast('Skopiowano schemat SQL do schowka!')}
              bgCard={bgCard}
              bgSubtle={bgSubtle}
              btnTactile={btnTactile}
              borderPixel={borderPixel}
            />
          )}

          {toastMessage && (
            <div
              className="fixed top-14 right-4 z-50 bg-[#1e1e24] text-[#f59e0b] border-2 border-[#f59e0b] px-4 py-2.5 text-xs font-bold shadow-[4px_4px_0px_0px_#000000] flex items-center gap-2 max-w-sm"
              style={{ fontFamily: "'JetBrains Mono', monospace" }}
            >
              <Sparkles className="w-4 h-4 shrink-0" />
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    // ============================================================================
    // SUB-COMPONENTS (Modals & Bottom Sheets)
    // ============================================================================
    function EditItemBottomSheet({
      item, listType, categories, onClose, onSave, onDelete, bgCard, bgSubtle, btnTactile, borderPixel
    }) {
      const [name, setName] = useState(item.name);
      const [quantity, setQuantity] = useState(String(item.quantity || 1));
      const [unit, setUnit] = useState(item.unit || 'szt.');
      const [unitPrice, setUnitPrice] = useState(
        item.unit_price !== null && item.unit_price !== undefined ? String(item.unit_price) : ''
      );
      const [category, setCategory] = useState(item.category || 'Inne');

      const adjustQuantity = (delta) => {
        const current = parseFloat(String(quantity).replace(',', '.')) || 1;
        const next = Math.max(0.5, Number((current + delta).toFixed(2)));
        setQuantity(String(next));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({ name, quantity, unit, unit_price: unitPrice, category });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className={`w-full sm:max-w-md ${bgCard} border-t-4 sm:border-2 border-[#1e1e24] shadow-[6px_6px_0px_0px_#1e1e24] p-4 sm:p-5`}>
            <div className="flex items-center justify-between border-b-2 border-[#1e1e24] pb-3 mb-4">
              <h3 className="text-sm font-bold uppercase" style={{ fontFamily: "'Silkscreen', cursive" }}>
                Edytuj pozycję
              </h3>
              <button onClick={onClose} className={`p-1 ${bgSubtle} ${borderPixel}`}>
                <X className="w-4 h-4" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold uppercase mb-1">Nazwa</label>
                <input
                  type="text"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  className={`w-full px-3 py-2 text-sm font-bold ${bgSubtle} ${borderPixel}`}
                />
              </div>

              {listType === 'shopping' && (
                <>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold uppercase mb-1">Ilość</label>
                      <div className="flex items-center gap-1">
                        <button
                          type="button"
                          onClick={() => adjustQuantity(-1)}
                          className={`w-10 h-10 bg-[#ef4444] text-white font-bold text-lg ${btnTactile}`}
                        >
                          -
                        </button>
                        <input
                          type="text"
                          inputMode="decimal"
                          value={quantity}
                          onChange={(e) => setQuantity(e.target.value)}
                          className={`w-full h-10 text-center text-sm font-bold ${bgSubtle} ${borderPixel}`}
                        />
                        <button
                          type="button"
                          onClick={() => adjustQuantity(1)}
                          className={`w-10 h-10 bg-[#10b981] text-[#1e1e24] font-bold text-lg ${btnTactile}`}
                        >
                          +
                        </button>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase mb-1">Jednostka</label>
                      <select
                        value={unit}
                        onChange={(e) => setUnit(e.target.value)}
                        className={`w-full h-10 px-2 text-sm font-bold ${bgSubtle} ${borderPixel}`}
                      >
                        {UNITS.map((u) => (
                          <option key={u} value={u}>{u}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase mb-1">
                      Cena jednostkowa PLN (aktualizuje też słownik domu)
                    </label>
                    <input
                      type="text"
                      inputMode="decimal"
                      placeholder="np. 4.50"
                      value={unitPrice}
                      onChange={(e) => setUnitPrice(e.target.value)}
                      className={`w-full px-3 py-2 text-sm font-bold ${bgSubtle} ${borderPixel}`}
                    />
                  </div>
                </>
              )}

              <div>
                <label className="block text-xs font-bold uppercase mb-1">Kategoria / Alejka</label>
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                  className={`w-full px-3 py-2 text-sm font-bold ${bgSubtle} ${borderPixel}`}
                >
                  {categories.map((c) => (
                    <option key={c.id} value={c.id}>{c.icon} {c.label}</option>
                  ))}
                </select>
              </div>

              <div className="flex items-center justify-between gap-2 pt-2">
                <button
                  type="button"
                  onClick={onDelete}
                  className={`px-3 py-2.5 bg-[#ef4444] text-white text-xs font-bold ${btnTactile} flex items-center gap-1`}
                >
                  <Trash2 className="w-4 h-4" /> Usuń
                </button>
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className={`px-4 py-2.5 ${bgSubtle} text-xs font-bold ${btnTactile}`}
                  >
                    Anuluj
                  </button>
                  <button
                    type="submit"
                    className={`px-5 py-2.5 bg-[#10b981] text-[#1e1e24] text-xs font-bold ${btnTactile}`}
                  >
                    Zapisz zmiany
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function HouseholdGateModal({
      isStandaloneGate = false,
      db,
      unlockedHouseholds = [],
      currentHousehold,
      onClose,
      onSelectHousehold,
      onUpdatePin,
      onLogoutHousehold,
      onCreateHousehold,
      bgCard,
      bgSubtle,
      btnTactile,
      borderPixel
    }) {
      const [tab, setTab] = useState('switch');
      const [codeQuery, setCodeQuery] = useState('');
      const [pinQuery, setPinQuery] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      // New household creation fields
      const [newCode, setNewCode] = useState('');
      const [newName, setNewName] = useState('');
      const [newPin, setNewPin] = useState('');
      const [memberName, setMemberName] = useState('');
      const [avatarId, setAvatarId] = useState('knight');
      const [colorHex, setColorHex] = useState('#3b82f6');

      // Current household PIN update field
      const [editPinValue, setEditPinValue] = useState(currentHousehold?.pin_hash || '');

      const handleJoinByCode = (e) => {
        e.preventDefault();
        setErrorMsg('');
        const cleanCode = codeQuery.trim().toUpperCase();
        const cleanPin = pinQuery.trim();

        if (!cleanCode) {
          setErrorMsg('Wpisz Kod Domu (np. DOM-GLOWNY).');
          return;
        }

        const match = db.households.find((h) => h.code.toUpperCase() === cleanCode);
        if (!match) {
          setErrorMsg(`Nie znaleziono domu o kodzie "${cleanCode}". Sprawdź pisownię lub utwórz nowy dom.`);
          return;
        }

        const requiredPin = (match.pin_hash || '').trim();
        if (requiredPin && requiredPin !== cleanPin) {
          setErrorMsg('Nieprawidłowy kod PIN dla tego gospodarstwa!');
          return;
        }

        onSelectHousehold(match.id);
      };

      const handleCreateSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');
        const cleanCode = newCode.trim().toUpperCase().replace(/\s+/g, '-');
        const cleanPin = newPin.trim();

        if (!cleanCode || !newName.trim() || !memberName.trim()) {
          setErrorMsg('Wypełnij Kod Domu, Nazwę Domu oraz swój Nick.');
          return;
        }
        if (cleanPin.length < 4) {
          setErrorMsg('Ustaw co najmniej 4-znakowy kod PIN chroniący dostęp do Waszego domu.');
          return;
        }
        if (db.households.some((h) => h.code.toUpperCase() === cleanCode)) {
          setErrorMsg(`Kod "${cleanCode}" jest już zajęty. Wybierz inny kod.`);
          return;
        }
        onCreateHousehold({
          code: cleanCode,
          name: newName.trim(),
          pin: cleanPin,
          memberName: memberName.trim(),
          avatarId,
          colorHex
        });
      };

      const wrapperClass = isStandaloneGate
        ? 'w-full max-w-lg'
        : 'fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-3';

      return (
        <div className={wrapperClass}>
          <div className={`w-full max-w-lg ${bgCard} ${borderPixel} shadow-[6px_6px_0px_0px_#1e1e24] p-4 sm:p-6 max-h-[92vh] overflow-y-auto`}>
            <div className="flex items-center justify-between border-b-2 border-[#1e1e24] pb-3 mb-4">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 bg-[#f59e0b] border-2 border-[#1e1e24] flex items-center justify-center shrink-0">
                  <Shield className="w-4 h-4 text-[#1e1e24]" />
                </div>
                <div>
                  <h3 className="text-sm font-bold uppercase" style={{ fontFamily: "'Silkscreen', cursive" }}>
                    {isStandaloneGate ? 'PIXELCART — LOGOWANIE DO DOMU' : 'DOSTĘP I KOD PIN DOMU'}
                  </h3>
                  <p className="text-[11px] opacity-75">
                    Prywatna przestrzeń rodziny chroniona Kodem Domu i PIN-em
                  </p>
                </div>
              </div>
              {!isStandaloneGate && (
                <button onClick={onClose} className={`p-1 ${bgSubtle} ${borderPixel}`}>
                  <X className="w-4 h-4" />
                </button>
              )}
            </div>

            <div className="grid grid-cols-2 gap-2 mb-4">
              <button
                type="button"
                onClick={() => { setTab('switch'); setErrorMsg(''); }}
                className={`py-2 text-xs font-bold uppercase ${borderPixel} ${tab === 'switch' ? 'bg-[#f59e0b] text-[#1e1e24]' : bgSubtle}`}
              >
                🔑 Zaloguj Kodem i PIN
              </button>
              <button
                type="button"
                onClick={() => { setTab('create'); setErrorMsg(''); }}
                className={`py-2 text-xs font-bold uppercase ${borderPixel} ${tab === 'create' ? 'bg-[#10b981] text-[#1e1e24]' : bgSubtle}`}
              >
                + Załóż Nowy Dom
              </button>
            </div>

            {errorMsg && (
              <div className="mb-3 p-2.5 bg-[#fef08a] text-[#dc2626] border-2 border-[#1e1e24] text-xs font-bold flex items-center gap-2">
                <AlertTriangle className="w-4 h-4 shrink-0" />
                <span>{errorMsg}</span>
              </div>
            )}

            {tab === 'switch' ? (
              <div className="space-y-4">
                <form onSubmit={handleJoinByCode} className={`p-3.5 ${bgSubtle} ${borderPixel} space-y-3`}>
                  <div className="text-xs font-bold uppercase">
                    Wpisz dane dostępowe Twojej rodziny:
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-[10px] font-bold uppercase mb-1">
                        Kod Domu (np. DOM-GLOWNY)
                      </label>
                      <input
                        type="text"
                        placeholder="DOM-..."
                        value={codeQuery}
                        onChange={(e) => setCodeQuery(e.target.value.toUpperCase())}
                        className={`w-full px-3 py-2 text-sm font-bold uppercase ${bgCard} ${borderPixel}`}
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold uppercase mb-1">
                        Kod PIN Domu
                      </label>
                      <input
                        type="password"
                        inputMode="numeric"
                        placeholder="••••"
                        value={pinQuery}
                        onChange={(e) => setPinQuery(e.target.value)}
                        className={`w-full px-3 py-2 text-sm font-bold ${bgCard} ${borderPixel}`}
                      />
                    </div>
                  </div>
                  <button
                    type="submit"
                    className={`w-full py-2.5 bg-[#3b82f6] text-white text-xs font-bold uppercase ${btnTactile}`}
                  >
                    Odblokuj i Otwórz Dom
                  </button>
                </form>

                {/* Active household PIN settings (only visible when logged in) */}
                {currentHousehold && (
                  <div className={`p-3.5 ${bgSubtle} ${borderPixel} space-y-2.5`}>
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold uppercase">
                        Акtywny Dom: <strong className="text-[#3b82f6]">{currentHousehold.code}</strong> ({currentHousehold.name})
                      </span>
                      <button
                        type="button"
                        onClick={onLogoutHousehold}
                        className="px-2 py-1 bg-[#ef4444] text-white text-[11px] font-bold border border-[#1e1e24]"
                      >
                        Wyloguj z tego domu
                      </button>
                    </div>

                    <div className="pt-2 border-t border-[#1e1e24]/20 flex items-end gap-2">
                      <div className="flex-1">
                        <label className="block text-[10px] font-bold uppercase mb-1">
                          Zmień / Ustaw kod PIN dla domu {currentHousehold.code}:
                        </label>
                        <input
                          type="text"
                          placeholder="np. 1234"
                          value={editPinValue}
                          onChange={(e) => setEditPinValue(e.target.value)}
                          className={`w-full px-2.5 py-1.5 text-xs font-bold ${bgCard} ${borderPixel}`}
                        />
                      </div>
                      <button
                        type="button"
                        onClick={() => onUpdatePin(currentHousehold.id, editPinValue.trim())}
                        className={`px-3 py-1.5 bg-[#10b981] text-[#1e1e24] text-xs font-bold ${btnTactile}`}
                      >
                        Zapisz PIN
                      </button>
                    </div>
                  </div>
                )}

                {/* Only show households that were already unlocked with PIN on this device */}
                {unlockedHouseholds.length > 0 && (
                  <div className="space-y-1.5">
                    <div className="text-[11px] font-bold uppercase opacity-75">
                      Zapamiętane domy na tym urządzeniu ({unlockedHouseholds.length}):
                    </div>
                    {unlockedHouseholds.map((h) => {
                      const isCurrent = h.id === currentHousehold?.id;
                      return (
                        <div
                          key={h.id}
                          onClick={() => onSelectHousehold(h.id)}
                          className={`p-2.5 cursor-pointer ${borderPixel} flex items-center justify-between ${
                            isCurrent ? 'bg-[#3b82f6] text-white font-bold' : bgSubtle
                          }`}
                        >
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-xs px-1.5 py-0.5 bg-[#1e1e24] text-[#f59e0b]" style={{ fontFamily: "'Silkscreen', cursive" }}>
                              🔒 {h.code}
                            </span>
                            <span className="text-xs font-bold">{h.name}</span>
                          </div>
                          <span className="text-[10px] uppercase px-1.5 py-0.5 bg-black/20">
                            {isCurrent ? 'AKTYWNY' : 'PRZEŁĄCZ'}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            ) : (
              <form onSubmit={handleCreateSubmit} className="space-y-3">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <div>
                    <label className="block text-xs font-bold uppercase mb-1">Kod Domu</label>
                    <input
                      type="text"
                      placeholder="np. DOM-MAREK"
                      value={newCode}
                      onChange={(e) => setNewCode(e.target.value.toUpperCase())}
                      className={`w-full px-3 py-2 text-sm font-bold uppercase ${bgSubtle} ${borderPixel}`}
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase mb-1">Kod PIN (min. 4 zn.)</label>
                    <input
                      type="text"
                      inputMode="numeric"
                      placeholder="np. 2580"
                      value={newPin}
                      onChange={(e) => setNewPin(e.target.value)}
                      className={`w-full px-3 py-2 text-sm font-bold ${bgSubtle} ${borderPixel}`}
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase mb-1">Nazwa Domu</label>
                    <input
                      type="text"
                      placeholder="np. Nasz Dom"
                      value={newName}
                      onChange={(e) => setNewName(e.target.value)}
                      className={`w-full px-3 py-2 text-sm font-bold ${bgSubtle} ${borderPixel}`}
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase mb-1">Twój Nick (Pierwszy Domownik)</label>
                  <input
                    type="text"
                    placeholder="np. Zdrawko"
                    value={memberName}
                    onChange={(e) => setMemberName(e.target.value)}
                    className={`w-full px-3 py-2 text-sm font-bold ${bgSubtle} ${borderPixel}`}
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase mb-1">Wybierz Postać RPG HD</label>
                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
                    {PIXEL_AVATARS.map((av) => (
                      <button
                        type="button"
                        key={av.id}
                        onClick={() => {
                          setAvatarId(av.id);
                          setColorHex(av.defaultColor);
                        }}
                        className={`p-2 flex flex-col items-center gap-1 border-2 border-[#1e1e24] ${
                          avatarId === av.id
                            ? 'bg-[#f59e0b] text-[#1e1e24] font-bold shadow-[2px_2px_0px_0px_#1e1e24]'
                            : bgSubtle
                        }`}
                      >
                        <PixelAvatar avatarId={av.id} colorHex={av.defaultColor} size={56} />
                        <span className="text-[11px] font-bold truncate w-full text-center">{av.badge} {av.name}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  type="submit"
                  className={`w-full py-2.5 bg-[#10b981] text-[#1e1e24] font-bold text-xs uppercase ${btnTactile}`}
                >
                  Utwórz Zabezpieczony Dom + Załaduj Słownik {DEFAULT_POLISH_CATALOG.length} Produktów
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    function MemberAvatarModal({
      household, members, currentMember, onClose, onSelectMember, onAddMember, onUpdateMember, bgCard, bgSubtle, btnTactile, borderPixel
    }) {
      const [editingMemberId, setEditingMemberId] = useState(null);
      const [displayName, setDisplayName] = useState('');
      const [avatarId, setAvatarId] = useState('robo');
      const [colorHex, setColorHex] = useState('#0284c7');

      const startEditMember = (m) => {
        setEditingMemberId(m.id);
        setDisplayName(m.display_name);
        setAvatarId(m.avatar_id);
        setColorHex(m.color_hex || '#2563eb');
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!displayName.trim()) return;
        if (editingMemberId) {
          onUpdateMember(editingMemberId, { displayName: displayName.trim(), avatarId, colorHex });
          setEditingMemberId(null);
          setDisplayName('');
        } else {
          if (members.length >= 5) return;
          onAddMember({ displayName: displayName.trim(), avatarId, colorHex });
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-3">
          <div className={`w-full max-w-xl ${bgCard} ${borderPixel} shadow-[6px_6px_0px_0px_#1e1e24] p-4 sm:p-5 max-h-[92vh] overflow-y-auto`}>
            <div className="flex items-center justify-between border-b-2 border-[#1e1e24] pb-3 mb-4">
              <h3 className="text-sm font-bold uppercase" style={{ fontFamily: "'Silkscreen', cursive" }}>
                DOMOWNICY I AWATARY ({household.code}) — {members.length}/5
              </h3>
              <button onClick={onClose} className={`p-1 ${bgSubtle} ${borderPixel}`}>
                <X className="w-4 h-4" />
              </button>
            </div>

            <div className="space-y-2 mb-5">
              {members.map((m) => {
                const isSelected = m.id === currentMember?.id;
                return (
                  <div
                    key={m.id}
                    className={`w-full p-2.5 flex items-center justify-between gap-2 ${borderPixel} ${
                      isSelected ? 'bg-[#f59e0b] text-[#1e1e24] font-bold' : bgSubtle
                    }`}
                  >
                    <button
                      type="button"
                      onClick={() => onSelectMember(m.id)}
                      className="flex items-center gap-3 flex-1 text-left min-w-0"
                    >
                      <PixelAvatar avatarId={m.avatar_id} colorHex={m.color_hex} size={48} />
                      <div className="min-w-0">
                        <div className="text-sm font-bold truncate">{m.display_name}</div>
                        <div className="text-[11px] opacity-80">
                          {(PIXEL_AVATARS.find((a) => a.id === m.avatar_id) || PIXEL_AVATARS[0]).name}
                        </div>
                      </div>
                    </button>
                    <div className="flex items-center gap-1.5 shrink-0">
                      <button
                        type="button"
                        onClick={() => startEditMember(m)}
                        className={`px-2.5 py-1 text-xs font-bold ${bgCard} text-[#1e1e24] border-2 border-[#1e1e24] hover:bg-[#3b82f6] hover:text-white flex items-center gap-1`}
                      >
                        <Edit3 className="w-3.5 h-3.5" /> Edytuj
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>

            {(editingMemberId || members.length < 5) && (
              <form onSubmit={handleSubmit} className="pt-4 border-t-2 border-[#1e1e24] space-y-3">
                <div className="flex items-center gap-3 p-3 border-2 border-[#1e1e24] bg-black/5">
                  <PixelAvatar avatarId={avatarId} colorHex={colorHex} size={64} />
                  <div className="flex-1">
                    <label className="block text-xs font-bold uppercase mb-1">Imię / Ksywka</label>
                    <input
                      type="text"
