    function DictionaryModal({
      household, catalog, onClose, onAddCatalogItem, onUpdateCatalogItem, onDeleteCatalogItem, bgCard, bgSubtle, btnTactile, borderPixel
    }) {
      const [query, setQuery] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('ALL');
      const [editingId, setEditingId] = useState(null);
      const [editName, setEditName] = useState('');
      const [editPrice, setEditPrice] = useState('');
      const [editUnit, setEditUnit] = useState('szt.');
      const [editCategory, setEditCategory] = useState('Inne');
      const [showAddForm, setShowAddForm] = useState(false);
      const [newName, setNewName] = useState('');
      const [newUnit, setNewUnit] = useState('szt.');
      const [newPrice, setNewPrice] = useState('');
      const [newCategory, setNewCategory] = useState('Inne');

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        return catalog
          .filter((c) => {
            const matchesCat = categoryFilter === 'ALL' || c.category === categoryFilter;
            const matchesQuery = !q || c.name.toLowerCase().includes(q) || (c.category && c.category.toLowerCase().includes(q));
            return matchesCat && matchesQuery;
          })
          .sort((a, b) => a.name.localeCompare(b.name, 'pl'));
      }, [catalog, query, categoryFilter]);

      const handleAddSubmit = (e) => {
        e.preventDefault();
        if (!newName.trim()) return;
        onAddCatalogItem({ name: newName.trim(), unit: newUnit, category: newCategory, price: newPrice });
        setNewName('');
        setNewPrice('');
        setShowAddForm(false);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-3">
          <div className={`w-full max-w-3xl ${bgCard} ${borderPixel} shadow-[6px_6px_0px_0px_#1e1e24] p-4 sm:p-6 max-h-[90vh] flex flex-col`}>
            <div className="flex items-center justify-between border-b-2 border-[#1e1e24] pb-3 mb-3">
              <div>
                <h3 className="text-sm font-bold uppercase" style={{ fontFamily: "'Silkscreen', cursive" }}>
                  SŁOWNIK PRODUKTÓW DOMU ({household.code})
                </h3>
                <p className="text-xs opacity-75">{catalog.length} produktów w słowniku</p>
              </div>
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => setShowAddForm((prev) => !prev)}
                  className={`px-3 py-1.5 bg-[#10b981] text-[#1e1e24] text-xs font-bold ${btnTactile} flex items-center gap-1`}
                >
                  <Plus className="w-3.5 h-3.5" /> Dodaj produkt
                </button>
                <button onClick={onClose} className={`p-1.5 ${bgSubtle} ${borderPixel}`}>
                  <X className="w-4 h-4" />
                </button>
              </div>
            </div>

            {showAddForm && (
              <form onSubmit={handleAddSubmit} className={`p-3 mb-3 ${bgSubtle} ${borderPixel} grid grid-cols-1 sm:grid-cols-5 gap-2 items-end`}>
                <div className="sm:col-span-2">
                  <label className="block text-[10px] font-bold uppercase mb-1">Nazwa produktu</label>
                  <input
                    type="text"
                    value={newName}
                    onChange={(e) => setNewName(e.target.value)}
                    className={`w-full px-2.5 py-1.5 text-xs font-bold ${bgCard} ${borderPixel}`}
                  />
                </div>
                <div>
                  <label className="block text-[10px] font-bold uppercase mb-1">Kategoria</label>
                  <select
                    value={newCategory}
                    onChange={(e) => setNewCategory(e.target.value)}
                    className={`w-full px-2 py-1.5 text-xs font-bold ${bgCard} ${borderPixel}`}
                  >
                    {SHOPPING_CATEGORIES.map((c) => (
                      <option key={c.id} value={c.id}>{c.icon} {c.label}</option>
                    ))}
                  </select>
                </div>
                <div className="grid grid-cols-2 gap-1">
                  <select
                    value={newUnit}
                    onChange={(e) => setNewUnit(e.target.value)}
                    className={`w-full px-1 py-1.5 text-xs font-bold ${bgCard} ${borderPixel}`}
                  >
                    {UNITS.map((u) => <option key={u} value={u}>{u}</option>)}
                  </select>
                  <input
                    type="text"
                    inputMode="decimal"
                    placeholder="Cena"
                    value={newPrice}
                    onChange={(e) => setNewPrice(e.target.value)}
                    className={`w-full px-2 py-1.5 text-xs font-bold ${bgCard} ${borderPixel}`}
                  />
                </div>
                <button type="submit" className={`py-1.5 px-3 bg-[#f59e0b] text-[#1e1e24] text-xs font-bold ${btnTactile}`}>
                  Zapisz
                </button>
              </form>
            )}

            <div className="flex flex-col sm:flex-row gap-2 mb-3">
              <input
                type="text"
                placeholder="Szukaj w słowniku..."
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                className={`flex-1 px-3 py-2 text-xs font-bold ${bgSubtle} ${borderPixel}`}
              />
              <select
                value={categoryFilter}
                onChange={(e) => setCategoryFilter(e.target.value)}
                className={`px-3 py-2 text-xs font-bold ${bgSubtle} ${borderPixel}`}
              >
                <option value="ALL">Wszystkie kategorie ({catalog.length})</option>
                {SHOPPING_CATEGORIES.map((c) => (
                  <option key={c.id} value={c.id}>{c.icon} {c.label}</option>
                ))}
              </select>
            </div>

            <div className="flex-1 overflow-y-auto space-y-1.5 pr-1">
              {filtered.map((item) => {
                const isEditing = editingId === item.id;
                return (
                  <div key={item.id} className={`p-2.5 ${bgSubtle} border border-[#1e1e24] flex flex-wrap items-center justify-between gap-2 text-xs`}>
                    {isEditing ? (
                      <div className="w-full flex flex-wrap items-center gap-2">
                        <input
                          type="text"
                          value={editName}
                          onChange={(e) => setEditName(e.target.value)}
                          className={`flex-1 min-w-[150px] px-2 py-1 ${bgCard} border border-[#1e1e24] font-bold`}
                        />
                        <select
                          value={editCategory}
                          onChange={(e) => setEditCategory(e.target.value)}
                          className={`px-2 py-1 ${bgCard} border border-[#1e1e24] font-bold`}
                        >
                          {SHOPPING_CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
                        </select>
                        <select
                          value={editUnit}
                          onChange={(e) => setEditUnit(e.target.value)}
                          className={`px-1.5 py-1 ${bgCard} border border-[#1e1e24] font-bold`}
                        >
                          {UNITS.map((u) => <option key={u} value={u}>{u}</option>)}
                        </select>
                        <input
                          type="text"
                          inputMode="decimal"
                          value={editPrice}
                          onChange={(e) => setEditPrice(e.target.value)}
                          className={`w-20 px-2 py-1 ${bgCard} border border-[#1e1e24] font-bold`}
                        />
                        <button
                          type="button"
                          onClick={() => {
                            const p = parseFloat(String(editPrice).replace(',', '.'));
                            onUpdateCatalogItem(item.id, {
                              name: editName,
                              price: !isNaN(p) ? Number(p.toFixed(2)) : null,
                              unit: editUnit,
                              category: editCategory
                            });
                            setEditingId(null);
                          }}
                          className="px-2.5 py-1 bg-[#10b981] text-[#1e1e24] font-bold border border-[#1e1e24]"
                        >
                          Zapisz
                        </button>
                      </div>
                    ) : (
                      <>
                        <div className="min-w-0 flex-1">
                          <span className="font-bold">{item.name}</span>
                          <span className="ml-2 px-1.5 py-0.5 bg-black/10 text-[10px]">{item.category}</span>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                          <span className="font-bold text-[#10b981]">
                            {item.last_known_price ? `${Number(item.last_known_price).toFixed(2)} zł / ${item.default_unit}` : item.default_unit}
                          </span>
                          <button
                            type="button"
                            onClick={() => {
                              setEditingId(item.id);
                              setEditName(item.name);
                              setEditPrice(item.last_known_price ? String(item.last_known_price) : '');
                              setEditUnit(item.default_unit || 'szt.');
                              setEditCategory(item.category || 'Inne');
                            }}
                            className="px-2 py-1 bg-black/10 hover:bg-[#f59e0b] hover:text-[#1e1e24] font-bold border border-[#1e1e24]"
                          >
                            Edytuj
                          </button>
                          <button
                            type="button"
                            onClick={() => onDeleteCatalogItem(item.id)}
                            className="p-1 bg-black/10 hover:bg-[#ef4444] hover:text-white border border-[#1e1e24]"
                          >
                            <Trash2 className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function ExportShareModal({
      household, list, uncheckedItems, checkedItems, totals, onClose, onCopied, bgCard, bgSubtle, btnTactile, borderPixel
    }) {
      const plainText = useMemo(() => {
        const lines = [];
        lines.push(`👾 PIXELCART — ${list.name.toUpperCase()} (${household.code})`);
        lines.push('====================================');
        if (uncheckedItems.length > 0) {
          lines.push('\nDO KUPIENIA / ZROBIENIA:');
          uncheckedItems.forEach((i) => {
            if (list.list_type === 'shopping') {
              const priceStr = i.unit_price ? ` — ${(Number(i.quantity) * Number(i.unit_price)).toFixed(2)} zł` : '';
              lines.push(`[ ] ${i.name} (${Number(i.quantity)} ${i.unit})${priceStr}`);
            } else {
              lines.push(`[ ] ${i.name} [${i.category || 'Zadanie'}]`);
            }
          });
        }
        if (checkedItems.length > 0) {
          lines.push('\nODHACZONE:');
          checkedItems.forEach((i) => lines.push(`[x] ${i.name}`));
        }
        if (list.list_type === 'shopping') {
          lines.push('\n------------------------------------');
          lines.push(`W koszyku: ${totals.inBasket} zł | Do kupienia: ${totals.toBuy} zł | Suma: ${totals.total} zł`);
        }
        return lines.join('\n');
      }, [household, list, uncheckedItems, checkedItems, totals]);

      const handleCopy = async () => {
        await copyTextToClipboard(plainText);
        onCopied();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-3">
          <div className={`w-full max-w-lg ${bgCard} ${borderPixel} shadow-[6px_6px_0px_0px_#1e1e24] p-5`}>
            <div className="flex items-center justify-between border-b-2 border-[#1e1e24] pb-3 mb-4">
              <h3 className="text-sm font-bold uppercase" style={{ fontFamily: "'Silkscreen', cursive" }}>
                UDOSTĘPNIJ / EKSPORTUJ TEKST
              </h3>
              <button onClick={onClose} className={`p-1 ${bgSubtle} ${borderPixel}`}>
                <X className="w-4 h-4" />
              </button>
            </div>

            <textarea
              readOnly
              value={plainText}
              rows={10}
              className={`w-full p-3 text-xs font-mono ${bgSubtle} ${borderPixel} mb-3`}
            />

            <div className="flex justify-end gap-2">
              <button onClick={onClose} className={`px-4 py-2 text-xs font-bold ${bgSubtle} ${btnTactile}`}>
                Zamknij
              </button>
              <button
                onClick={handleCopy}
                className={`px-4 py-2 bg-[#10b981] text-[#1e1e24] text-xs font-bold ${btnTactile} flex items-center gap-1.5`}
              >
                <Copy className="w-4 h-4" /> Kopiuj tekst listy
              </button>
            </div>
          </div>
        </div>
      );
    }

                  <input
                    type="url"
                    placeholder="https://twoj-projekt.supabase.co"
                    value={url}
                    onChange={(e) => setUrl(e.target.value)}
                    className={`w-full px-2.5 py-1.5 text-xs font-bold ${bgCard} ${borderPixel}`}
                  />
                </div>
                <div>
                  <label className="block text-[10px] font-bold uppercase mb-1">
                    API Key: anon / public (Settings → API Keys)
                  </label>
                  <input
                    type="password"
                    placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    value={anonKey}
                    onChange={(e) => setAnonKey(e.target.value)}
                    className={`w-full px-2.5 py-1.5 text-xs font-bold ${bgCard} ${borderPixel}`}
                  />
                </div>
              </div>

              <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                <span className="text-[11px] opacity-75">
                  Możesz też wpisać te klucze na stałe w pliku <code>index.html</code> w sekcji <code>PIXELCART_SUPABASE_CONFIG</code>.
                </span>
                <div className="flex items-center gap-2">
                  {url && (
                    <button
                      type="button"
                      onClick={() => {
                        setUrl('');
                        setAnonKey('');
                        onSaveSupaConfig({ url: '', anonKey: '' });
                      }}
                      className={`px-3 py-1.5 bg-[#ef4444] text-white text-xs font-bold ${btnTactile}`}
                    >
                      Rozłącz
                    </button>
                  )}
                  <button
                    type="submit"
                    className={`px-4 py-1.5 bg-[#10b981] text-[#1e1e24] text-xs font-bold ${btnTactile}`}
                  >
                    Zapisz i Połącz z Supabase
                  </button>
                </div>
              </div>
            </form>

            <div className="text-xs font-bold uppercase mb-1.5">
              Skrypt SQL (Wklej w Supabase → SQL Editor → New Query → RUN):
            </div>
            <pre className={`flex-1 min-h-[220px] p-3 text-[11px] font-mono overflow-auto ${bgSubtle} ${borderPixel} mb-3`}>
              {SUPABASE_SQL_SCHEMA}
            </pre>

            <div className="flex justify-end gap-2">
              <button onClick={onClose} className={`px-4 py-2 text-xs font-bold ${bgSubtle} ${btnTactile}`}>
                Zamknij
              </button>
              <button
                onClick={handleCopySql}
                className={`px-4 py-2 bg-[#f59e0b] text-[#1e1e24] text-xs font-bold ${btnTactile} flex items-center gap-1.5`}
              >
                <Copy className="w-4 h-4" /> Kopiuj cały schemat SQL
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
